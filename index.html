<script>
'use strict';
// ======================= Dragon's Rampage =======================
// You are the dragon. Burn, stomp and feast. The more damage you do,
// the more the kingdom fights back: knights -> archers -> scorpions -> catapults.
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let VW=960,VH=640,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=VW*DPR;cv.height=VH*DPR;}
addEventListener('resize',resize);resize();
const WW=3200,WH=2200;
const TAU=Math.PI*2;
const rnd=Math.random, R=(a,b)=>a+rnd()*(b-a), RI=(a,b)=>Math.floor(R(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), d2=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
let seed=1337; const srnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};

// ---------- layout ----------

const VILLAGES=[{x:800,y:720},{x:2400,y:720},{x:1600,y:1150},{x:900,y:1720},{x:2350,y:1720},
  {x:500,y:2750,name:'Millbrook'},{x:2350,y:2900,name:'Riverbend'},{x:800,y:4050,name:'Southwold'},{x:2150,y:4150,name:'Haybury'},{x:4000,y:700,name:'Stonebrook'},{x:5050,y:1500,name:'Saltmere'},{x:4300,y:4100,name:'Crabhaven'}];
const CAMP={x:470,y:1220};        // logging camp at west forest edge
const MINE={x:2860,y:1260};       // mine entrance in eastern rocky hills
const LOGPILE_POS={x:560,y:1300}, STONEPILE_POS={x:2700,y:1380};
const FARMS=[ // field rect, barn, pen
 {v:0,field:{x:420,y:560,w:240,h:170,crop:'wheat'},barn:{x:520,y:800},pen:{x:380,y:830,w:150,h:110,animal:'sheep'}},
 {v:1,field:{x:2560,y:560,w:240,h:170,crop:'corn'},barn:{x:2680,y:800},pen:{x:2780,y:700,w:150,h:120,animal:'cow'}},
 {v:2,field:{x:1300,y:1250,w:200,h:150,crop:'wheat'},barn:{x:1250,y:1080},pen:{x:1780,y:1260,w:150,h:110,animal:'pig'}},
 {v:3,field:{x:1060,y:1820,w:260,h:160,crop:'corn'},barn:{x:620,y:1780},pen:{x:640,y:1880,w:160,h:110,animal:'cow'}},
 {v:4,field:{x:1980,y:1800,w:240,h:170,crop:'wheat'},barn:{x:2600,y:1760},pen:{x:2560,y:1850,w:160,h:110,animal:'sheep'}},
 {v:5,field:{x:760,y:2620,w:240,h:160,crop:'wheat'},barn:{x:300,y:2600},pen:{x:230,y:2930,w:150,h:110,animal:'sheep'}},
 {v:6,field:{x:2550,y:3050,w:220,h:150,crop:'corn'},barn:{x:2150,y:3080},pen:{x:2560,y:2640,w:150,h:110,animal:'pig'}},
 {v:7,field:{x:1000,y:3950,w:260,h:160,crop:'wheat'},barn:{x:520,y:4000},pen:{x:400,y:4200,w:150,h:110,animal:'cow'}},
 {v:8,field:{x:2350,y:4050,w:240,h:170,crop:'corn'},barn:{x:1900,y:4000},pen:{x:1860,y:4330,w:160,h:110,animal:'sheep'}},
];
const PADDOCKS=[{x:1950,y:930,w:300,h:170},{x:1100,y:2480,w:420,h:240},{x:1250,y:4300,w:460,h:230}]; // horse paddocks
const ROCKS=[]; // decorative hills/rocks (not burnable)
const LAIR={x:3750,y:2500};        // the dragon's nest (deliver gold + princess here)
const CABIN={x:-1500,y:1100};         // hunter's cabin deep in the north-west forest
const WILD={x:-1950,y:780,w:900,h:700}; // deer & rabbit range around the cabin
const PONDS=[{x:1200,y:600,rx:70,ry:42},{x:2080,y:1430,rx:80,ry:46},{x:1500,y:3300,rx:520,ry:300,lake:1},{x:3000,y:3470,rx:110,ry:28,lake:1}];
const PRINCESS_TOWER={x:1790,y:125};
const CWALL={x0:1320,x1:1880,y0:65,y1:315}; // castle wall rectangle
const TOWER_SPOTS=[[1320,65],[1880,65],[1320,315],[1880,315],[1460,65],[1740,315],[1320,190],[1880,190],[1460,315],[1600,65],[1740,65],[1530,315]];
let EASY=localStorage.getItem('dr_easy')==='1';

// ---------- state ----------
let PR, goldPiles, G, D, structures, trees, cells, units, siege, projs, boulders, carts, parts, texts, ground, gctx;
let keys={}, pressed={}, scene='title', paused=false, last=0, best=+(localStorage.getItem('dr_best')||0);
const THRESH=[10,28,50,75];
const LEVEL_NAMES=['Calm','Knights','+ Archers','+ Scorpions','+ Catapults'];

function newGame(opt){opt=opt||{};const lvl=opt.lvl||1;
  seed=1337;
  G={lvl,bank:opt.bank||0,easy:EASY,dmgMul:EASY?.55:1,alarmMul:EASY?.75:1,waveMul:(EASY?.5:1)*(1+.25*(lvl-1)),gold:0,stash:0,won:false,wonT:0,spawnQ:[],spawnQT:0,gateOpenT:0,postT:0,hunterT:3,quipT:0,
     t:0,alarm:0,level:0,lastLevel:0,sinceDmg:99,waveNum:0,waveCD:0,reinforceT:0,banner:null,shake:0,
     wood:8,stone:4,cartsPool:3,cartBuildT:0,spawnT:0,rebuildT:0,
     visited:{},region:null,regCand:null,regCandT:0,fc:0,patrolT:20,packAngry:{},faunaT:5,regBanner:null,
     stats:{regions:0,bridges:0,huts:0,barns:0,trees:0,crops:0,eaten:0,animals:0,knights:0,archers:0,siege:0,carts:0,piles:0,ships:0,pirates:0,squid:0,seaPts:0},score:0,over:false,overT:0,msg:null};
  D={x:1600,y:1450,vx:0,vy:0,ang:-Math.PI/2,alt:0,altT:0,mode:"ground",hp:EASY?360:220,maxHp:EASY?360:220,gold:0,princess:false,st:100,maxSt:100,
     breath:false,stompCD:0,stompT:0,eatCD:0,eatT:0,hurt:0,walkT:0,flapT:0,landDust:false,hunger:100,maxHunger:100,starveT:0,hungryWarn:false};
  structures=[];trees=[];cells=[];units=[];siege=[];projs=[];boulders=[];carts=[];parts=[];texts=[];ROCKS.length=0;patrols=[];FARSCORCH.length=0;
  // villages
  VILLAGES.forEach((v,vi)=>{const n=7+Math.floor(SR(0,3));for(let i=0;i<n;i++){const a=i/n*TAU+SR(-.2,.2),r=SR(70,170);
    addStruct('hut',v.x+Math.cos(a)*r,v.y+Math.sin(a)*r*0.8,vi);} });
  FARMS.forEach((f,fi)=>{const s=addStruct('barn',f.barn.x,f.barn.y,f.v);s.farm=fi;
    const F=f.field;for(let y=F.y;y<F.y+F.h;y+=22)for(let x=F.x;x<F.x+F.w;x+=22)cells.push({x:x+11,y:y+11,crop:F.crop,growth:SR(.7,1),fire:0,burnt:false,farm:fi,claimed:null});});
  addStruct('logpile',LOGPILE_POS.x,LOGPILE_POS.y,-1);
  addStruct('cabin',CABIN.x,CABIN.y,-1);
  const gt=addStruct('gate',1600,CWALL.y1+6,-1);gt.hp=gt.maxHp=260+80*(lvl-1);
  const br=addStruct('barracks',1430,250,-1);br.hp=br.maxHp=220+60*(lvl-1);
  PR={x:PRINCESS_TOWER.x,y:PRINCESS_TOWER.y,state:'tower',quip:0,t:0};
  goldPiles=[[1480,150],[1560,215],[1650,150],[1700,240],[1620,265]].map(([x,y])=>({x,y,amt:20+10*(lvl-1)}));
  addStruct('stonepile',STONEPILE_POS.x,STONEPILE_POS.y,-1);
  // rocks / hills in the east
  for(let i=0;i<46;i++){const x=SR(2680,3150),y=SR(950,1650);if(d2(x,y,MINE.x,MINE.y)<70)continue;ROCKS.push({x,y,r:SR(14,40),c:SR(0,1)});}
  for(let i=0;i<300;i++){const x=SR(3250,5300),y=SR(-150,3000);if(regionKey(x,y)!=='hills'||VILLAGES.some(v=>d2(x,y,v.x,v.y)<260)||d2(x,y,LAIR.x,LAIR.y)<450)continue;ROCKS.push({x,y,r:SR(14,44),c:SR(0,1)});}
  // trees: dense west forest + scattered
  const blocked=(x,y)=>{ if(x>CASTLE.x-CASTLE.w/2-80&&x<CASTLE.x+CASTLE.w/2+80&&y<CASTLE.y+CASTLE.h/2+120)return true;
    for(const v of VILLAGES)if(d2(x,y,v.x,v.y)<210)return true;
    for(const f of FARMS){const F=f.field;if(x>F.x-30&&x<F.x+F.w+30&&y>F.y-30&&y<F.y+F.h+30)return true;
      const P=f.pen;if(x>P.x-30&&x<P.x+P.w+30&&y>P.y-30&&y<P.y+P.h+30)return true;if(d2(x,y,f.barn.x,f.barn.y)<70)return true;}
    if(x>2650&&y>920&&y<1680)return true; if(d2(x,y,CAMP.x,CAMP.y)<90||d2(x,y,LOGPILE_POS.x,LOGPILE_POS.y)<70)return true;
    if(d2(x,y,1600,1450)<120)return true; if(PONDS.some(p=>d2(x,y,p.x,p.y)<110))return true; if(inWater(x,y)||riverD(x,y)<RIVW+40||onBeach(x,y))return true;
    {const lx=(x-LAKE.x)/(LAKE.rx+70),ly=(y-LAKE.y)/(LAKE.ry+70);if(lx*lx+ly*ly<1)return true;} if(PADDOCKS.some(P=>x>P.x-30&&x<P.x+P.w+30&&y>P.y-30&&y<P.y+P.h+30))return true; if(d2(x,y,LAIR.x,LAIR.y)<170||d2(x,y,CABIN.x,CABIN.y)<75)return true; return false;};
  let tries=0;while(trees.length<240&&tries<5000){tries++;const x=SR(40,430),y=SR(300,2150);if(!blocked(x,y))addTree(x,y);}
  tries=0;while(trees.length<420&&tries<5000){tries++;const x=SR(40,WW-40),y=SR(420,WH-40);if(!blocked(x,y))addTree(x,y);}
  for(let i=0;i<30;i++){const x=CAMP.x+SR(-180,60),y=CAMP.y+SR(-260,260);if(!blocked(x,y)&&x<480)addTree(x,y);}
  // the Deepwood (far west), scattered southern copses and a few hill trees
  tries=0;let nt=trees.length;while(trees.length<nt+900&&tries<9000){tries++;const x=SR(-2900,-250),y=SR(-150,4300);if(regionKey(x,y)==='forest'&&!blocked(x,y))addTree(x,y);}
  tries=0;nt=trees.length;while(trees.length<nt+160&&tries<4000){tries++;const x=SR(-200,5200),y=SR(2250,4300);const k=regionKey(x,y);if((k==='south'||k==='farm')&&!blocked(x,y)&&(x<0||x>WW||y>WH))addTree(x,y);}
  tries=0;nt=trees.length;while(trees.length<nt+50&&tries<2000){tries++;const x=SR(3250,5200),y=SR(-100,3000);if(regionKey(x,y)==='hills'&&!blocked(x,y)&&d2(x,y,LAIR.x,LAIR.y)>420)addTree(x,y);}
  addBridges();
  // people
  structures.filter(s=>s.kind==='hut').forEach(s=>spawnVillager(s.x,s.y+20,'peasant',s.v));
  for(let i=0;i<3;i++)spawnVillager(CAMP.x+R(-20,20),CAMP.y+R(-20,20),'woodcutter',0);
  for(let i=0;i<3;i++)spawnVillager(MINE.x-60+R(-20,20),MINE.y+40,'miner',1);
  FARMS.forEach((f,fi)=>{for(let k=0;k<2;k++){const u=spawnVillager(f.field.x+20+k*40,f.field.y+20,'farmer',f.v);u.farm=fi;}
    const P=f.pen,n=f.pen.animal==='cow'?3:4;for(let i=0;i<n;i++)units.push(mkUnit('animal',P.x+R(15,P.w-15),P.y+R(15,P.h-15),{species:P.animal,pen:P,hp:14}));});
  // farm chickens around the barns, wild deer & rabbits around the hunter's cabin
  FARMS.forEach(f=>{f.yard={x:f.barn.x-70,y:f.barn.y+18,w:140,h:50};for(let i=0;i<4;i++)units.push(mkUnit('animal',f.yard.x+R(10,130),f.yard.y+R(8,42),{species:'chicken',pen:f.yard,hp:6,free:true}));});
  initFauna();
  spawnHunter();
  initBirds();
  // castle garrison: tower archers on the walls + gate guards
  const nT=Math.min(TOWER_SPOTS.length,Math.round((EASY?2:4)+(EASY?1:2)*(lvl-1))),nG=Math.min(12,Math.round((EASY?2:3)+(EASY?1:2)*(lvl-1)));
  for(let i=0;i<nT;i++)spawnPost('tower',i);for(let i=0;i<nG;i++)spawnPost('guard',i);
  buildGround();buildTerrain();initFog();initSea();
}
function addStruct(kind,x,y,v){const hp={hut:90,barn:170,logpile:110,stonepile:140,cabin:120,gate:260,barracks:220,bridge:120}[kind];
  const s={kind,x,y,v,hp,maxHp:hp,fire:0,state:'ok',build:0,builder:null,id:Math.random()};structures.push(s);return s;}
function addTree(x,y){trees.push({x,y,hp:40,fire:0,state:'ok',s:SR(.8,1.25),fallT:0,fallA:0,regrow:0,claimed:null,hue:SR(0,1)});}
function mkUnit(type,x,y,o){return Object.assign({type,x,y,vx:0,vy:0,hp:10,maxHp:10,burn:0,state:'idle',t:0,anim:0,face:1,id:Math.random(),dead:false},o||{});}
function spawnVillager(x,y,job,v){const u=mkUnit('villager',x,y,{job,v,hp:10,maxHp:10,home:VILLAGES[Math.max(0,v)]||VILLAGES[0],shirt:['#b5523b','#3f6fb5','#6a8f3a','#a07a2a','#8a4f9e'][RI(0,4)]});units.push(u);return u;}

function buildGround(){
  ground=document.createElement('canvas');ground.width=WW;ground.height=WH;gctx=ground.getContext('2d');
  const g=gctx;
  for(let i=0;i<2600;i++){g.fillStyle=srnd()<.5?'rgba(80,130,50,.35)':'rgba(120,160,70,.25)';g.beginPath();g.ellipse(SR(0,WW),SR(0,WH),SR(10,60),SR(6,30),SR(0,3),0,TAU);g.fill();}
  // forest floor
  g.fillStyle='rgba(40,70,30,.45)';g.beginPath();g.ellipse(230,1250,330,1000,0,0,TAU);g.fill();
  // rocky hills
  g.fillStyle='#8a7d68';g.beginPath();g.ellipse(2930,1300,330,400,0,0,TAU);g.fill();
  g.fillStyle='rgba(110,100,85,.6)';for(let i=0;i<200;i++){g.beginPath();g.arc(SR(2650,3200),SR(950,1650),SR(3,14),0,TAU);g.fill();}
  // dirt roads: castle -> villages, camp, mine
  g.strokeStyle='#a48a5c';g.lineCap='round';g.lineWidth=26;
  const road=(a,b)=>{g.beginPath();g.moveTo(a.x,a.y);g.quadraticCurveTo((a.x+b.x)/2+SR(-80,80),(a.y+b.y)/2+SR(-80,80),b.x,b.y);g.stroke();};
  VILLAGES.forEach(v=>road(GATE,v));road(VILLAGES[0],CAMP);road(VILLAGES[3],CAMP);road(VILLAGES[1],MINE);road(VILLAGES[4],STONEPILE_POS);road(VILLAGES[2],VILLAGES[3]);road(VILLAGES[2],VILLAGES[4]);
  g.lineWidth=14;g.strokeStyle='#b89c6a';VILLAGES.forEach(v=>road(GATE,v));
  VILLAGES.forEach(v=>{g.fillStyle='#a8915f';g.beginPath();g.ellipse(v.x,v.y,120,90,0,0,TAU);g.fill();});
  // fields soil
  FARMS.forEach(f=>{const F=f.field;g.fillStyle='#7a5a32';g.fillRect(F.x-4,F.y-4,F.w+8,F.h+8);
    const P=f.pen;g.fillStyle='#7fa84a';g.fillRect(P.x,P.y,P.w,P.h);});
  // camp clearing, mine yard
  g.fillStyle='#9a8256';g.beginPath();g.ellipse(CAMP.x+30,CAMP.y+30,120,110,0,0,TAU);g.fill();
  g.beginPath();g.ellipse(2760,1330,140,90,0,0,TAU);g.fill();
  // castle grounds, courtyard flagstones, roads to lair & cabin
  g.fillStyle='#6b7a5a';g.fillRect(CWALL.x0-50,0,CWALL.x1-CWALL.x0+100,CWALL.y1+40);
  g.fillStyle='#b3a487';g.fillRect(CWALL.x0,CWALL.y0,CWALL.x1-CWALL.x0,CWALL.y1-CWALL.y0);
  g.strokeStyle='rgba(90,80,60,.35)';g.lineWidth=1;for(let x=CWALL.x0;x<CWALL.x1;x+=28)for(let y=CWALL.y0;y<CWALL.y1;y+=20){g.strokeRect(x+((y/20)%2)*14,y,28,20);}
  g.fillStyle='rgba(40,70,30,.4)';g.beginPath();g.ellipse(CABIN.x,CABIN.y,90,70,0,0,TAU);g.fill();
  g.fillStyle='#8a7a62';g.beginPath();g.ellipse(CABIN.x+10,CABIN.y+20,60,40,0,0,TAU);g.fill();
  g.fillStyle='#5a4a3a';g.beginPath();g.ellipse(LAIR.x,LAIR.y,170,120,0,0,TAU);g.fill();g.fillStyle='#6e5d48';g.beginPath();g.ellipse(LAIR.x,LAIR.y,130,90,0,0,TAU);g.fill();
  // ponds (ducks & geese)
  PONDS.forEach(p=>{g.fillStyle='#4a6a3a';g.beginPath();g.ellipse(p.x,p.y,p.rx+10,p.ry+8,0,0,TAU);g.fill();g.fillStyle='#3a6aa8';g.beginPath();g.ellipse(p.x,p.y,p.rx,p.ry,0,0,TAU);g.fill();
    g.fillStyle='rgba(255,255,255,.18)';g.beginPath();g.ellipse(p.x-p.rx*.3,p.y-p.ry*.3,p.rx*.4,p.ry*.25,0,0,TAU);g.fill();});
  // wells at every village centre (for the bucket brigade)
  VILLAGES.forEach(v=>{g.fillStyle='#7a7a80';g.beginPath();g.arc(v.x,v.y,13,0,TAU);g.fill();g.fillStyle='#2a4a8a';g.beginPath();g.arc(v.x,v.y,8,0,TAU);g.fill();});
}
function scorch(x,y,r){if(x<r||y<r||x>WW-r||y>WH-r){scorchFar(x,y,r);return;}gctx.fillStyle='rgba(30,22,15,.55)';gctx.beginPath();gctx.ellipse(x,y,r,r*.75,0,0,TAU);gctx.fill();
  gctx.fillStyle='rgba(20,15,10,.35)';for(let i=0;i<5;i++){gctx.beginPath();gctx.arc(x+R(-r,r)*.7,y+R(-r,r)*.5,R(3,r*.4),0,TAU);gctx.fill();}}
function spawnHunter(){const u=mkUnit('hunter',CABIN.x+30,CABIN.y+30,{hp:EASY?40:60,maxHp:EASY?40:60,shootT:2,atk:0,home:CABIN});units.push(u);return u;}
function spawnPost(kind,i){if(kind==='tower'){const [x,y]=TOWER_SPOTS[i%TOWER_SPOTS.length];units.push(mkUnit('archer',x,y-6,{post:'tower',slot:i,px:x,py:y-6,hp:22,maxHp:22,shootT:R(1,3)}));}
  else{const x=GATE.x-70+(i%6)*28,y=GATE.y+34+Math.floor(i/6)*26;units.push(mkUnit('knight',x,y,{post:'guard',slot:i,px:x,py:y,hp:45,maxHp:45,atk:0,colr:'#c33'}));}}
// ======================= the big explorable world: regions, terrain, decor, fog of war =======================
const WX0=-3400,WY0=-2600,WX1=9800,WY1=6200,TS=8; // world bounds (the old kingdom map is the 0..3200 x 0..2200 core)
const coastX=y=>5500+140*Math.sin(y/530)+60*Math.sin(y/190+1);
const coastY=x=>4450+110*Math.sin(x/470)+50*Math.sin(x/170+2);
const frostY=x=>-260+90*Math.sin(x/420)+40*Math.sin(x/150);
const forestX=y=>-180+70*Math.sin(y/310)+30*Math.sin(y/97);
const LAKE={x:1500,y:3300,rx:520,ry:300};
const RIVER=[[1980,3330],[2500,3520],[3000,3470],[3500,3700],[4100,3640],[4700,3880],[5250,3820],[5900,3900]],RIVW=48;
function hsh(i,j){let h=Math.imul(i,374761393)+Math.imul(j,668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}

    if(moveTo(L,p.wp.x,p.wp.y,sp,dt))p.wp=null;const ha=Math.atan2(p.wp?p.wp.y-L.y:0,p.wp?p.wp.x-L.x:1);
    for(let i=1;i<p.members.length;i++){const u=p.members[i],row=Math.ceil(i/2),side=i%2?1:-1,tx=L.x-Math.cos(ha)*30*row-Math.sin(ha)*18*side,ty=L.y-Math.sin(ha)*30*row+Math.cos(ha)*18*side;
      if(far){u.x=tx;u.y=ty;}else moveTo(u,tx,ty,sp*1.5,dt);if(u.mounted){u.cs='wheel';u.ha=ha;u.anim+=dt*6;}}

function updDragon(dt){
  let ix=0,iy=0;if(keys['a']||keys['arrowleft'])ix--;if(keys['d']||keys['arrowright'])ix++;if(keys['w']||keys['arrowup'])iy--;if(keys['s']||keys['arrowdown'])iy++;
  let il=Math.hypot(ix,iy)||1;ix/=il;iy/=il;
  if(!ix&&!iy&&(GPAD.mx||GPAD.my)){ix=GPAD.mx;iy=GPAD.my;} // analog stick / d-pad (magnitude = speed)
  // take off / land
  if(P('f')){ if(D.mode==='ground'){ if(D.st>=DR.takeoffMin){D.mode='air';D.altT=1;puff(D.x,D.y,18,'rgba(190,170,130,',120,14);float(D.x,D.y-60,'Take off!','#cfe8ff');}
      else float(D.x,D.y-60,'Too tired to fly!','#ffb0a0'); }
    else {D.mode='ground';D.altT=0;D.landDust=true;D.diveFrom=D.alt;G.diveT=G.t;} }
  if(D.mode==='air'){D.st-=(DR.flyDrain+(D.breath?DR.breathAirDrain:0))*(G.easy?.7:1)*dt;if(D.st<=0){D.st=0;D.mode='ground';D.altT=0;D.landDust=true;float(D.x,D.y-60,'Exhausted! Landing…','#ffb0a0');}}
  else D.st=Math.min(D.maxSt,D.st+DR.groundRegen*dt);
  const prevAlt=D.alt;D.alt+=clamp(D.altT-D.alt,-1.5*dt,1.2*dt);
  if(D.landDust&&D.alt<=0.001&&prevAlt>0){D.landDust=false;puff(D.x,D.y,34,'rgba(180,160,120,',170,16);G.shake=Math.max(G.shake,8);
    for(const u of units)if(!u.dead&&dist(u,D)<90&&u.type!=='animal'&&u.type!=='sea'){u.vx+=(u.x-D.x)*2;u.vy+=(u.y-D.y)*2;}}
  const wasSwim=D.swim;D.swim=D.mode==='ground'&&D.alt<.25&&inWater(D.x,D.y)&&!onBridge(D.x,D.y);D.overWater=D.alt>=.25&&inWater(D.x,D.y);
  if(D.swim&&!wasSwim){puff(D.x,D.y,24,'rgba(220,240,255,',150,12);if(!G.swimTip){G.swimTip=1;float(D.x,D.y-90,'Splash! Swimming: slower, no stomp, bite & fire still work','#bfe6ff');}}
  if(D.swim&&D.mode==='ground')D.st=Math.max(0,D.st-DR.groundRegen*.5*dt); // half stamina regen in the water
  const sp=lerp(DR.groundSpeed,DR.airSpeed,D.alt)*(D.eatT>0?0.4:1)*(D.stompT>0?0.3:1)*(D.swim?0.55:1);
  const acc=D.alt>0.5?4:8;D.vx=lerp(D.vx,ix*sp,Math.min(1,acc*dt));D.vy=lerp(D.vy,iy*sp,Math.min(1,acc*dt));
  const ox_=D.x,oy_=D.y;D.x=clamp(D.x+D.vx*dt,WX0+60,WX1-60);D.y=clamp(D.y+D.vy*dt,WY0+60,WY1-60);
  // castle walls block a walking dragon (fly over them, or smash the gate)
  if(D.alt<0.5){const inC=(x,y)=>x>CWALL.x0&&x<CWALL.x1&&y>CWALL.y0&&y<CWALL.y1;
    if(inC(ox_,oy_)!==inC(D.x,D.y)){const gate=structures.find(s=>s.kind==='gate');const thruGate=gate&&gate.state==='ruin'&&Math.abs(D.x-GATE.x)<50&&D.y>CWALL.y1-60;
      if(!thruGate){D.x=ox_;D.y=oy_;D.vx*=-.2;D.vy*=-.2;if(!D.wallMsg||G.t-D.wallMsg>3){D.wallMsg=G.t;float(D.x,D.y-90,'Castle walls! Fly over (F) or smash the gate','#ffd');}}}}
  if(ix||iy){const ta=Math.atan2(iy,ix);D.ang+=angDiff(ta,D.ang)*Math.min(1,10*dt);D.walkT+=dt*(D.alt<.3?7:0);}
  D.flapT+=dt*(D.alt>0.1?(D.alt<0.95?14:9):0);
  D.hurt=Math.max(0,D.hurt-dt);D.stompCD-=dt;D.eatCD-=dt;D.stompT=Math.max(0,D.stompT-dt);D.eatT=Math.max(0,D.eatT-dt);
  // fire breath
  D.breath=!!(keys[' ']||GPAD.fire)&&!(D.mode==='air'&&D.st<=0.5);
  if(D.breath){const ca=Math.cos(D.ang),sa=Math.sin(D.ang),ox=D.x+ca*105,oy=D.y+sa*105,h=heightOf()+18;
    for(let i=0;i<7;i++){const a=D.ang+R(-DR.fireHalf,DR.fireHalf)*.8,s=R(260,380);
      parts.push({x:ox,y:oy,z:h,vx:Math.cos(a)*s+D.vx*.5,vy:Math.sin(a)*s+D.vy*.5,vz:-h*1.6-R(0,30),life:R(.4,.6),max:.6,size:R(8,16),kind:'breath'});}
    applyFire(ox,oy,dt);}
  // stomp (ground only)
  if((P('q')||P('shift'))&&D.swim){float(D.x,D.y-80,'No stomping while swimming!','#bfe6ff');}
  else if((P('q')||P('shift'))){ if(D.alt>0.2)float(D.x,D.y-80,'Land first to stomp!','#ffd');
    else if(D.stompCD<=0){D.stompCD=DR.stompCD;D.stompT=0.35;doStomp();} }

function inFire(x,y,ox,oy){const dx=x-ox,dy=y-oy,dd=Math.hypot(dx,dy);if(dd>DR.fireRange+10)return false;if(dd<50)return true;
  return Math.abs(angDiff(Math.atan2(dy,dx),D.ang))<DR.fireHalf;}
function applyFire(ox,oy,dt){
  for(const t of trees)if(t.state==='ok'&&!t.fire&&inFire(t.x,t.y,ox,oy)){t.fire=1;addAlarm(.3);}
  for(const s of structures)if(s.state!=='ruin'&&!stoneish(s)&&inFire(s.x,s.y,ox,oy)){if(!s.fire){s.fire=1;addAlarm(.8);}hurtStruct(s,DR.fireDps*.7*dt);}
  for(const t of trees)if(t.fire&&t.state==='ok'&&inFire(t.x,t.y,ox,oy))t.hp-=DR.fireDps*.4*dt;
  for(const c of cells)if(!c.burnt&&!c.fire&&c.growth>.15&&inFire(c.x,c.y,ox,oy)){c.fire=1;}
  for(const c of carts)if(!c.wrecked&&!c.fire&&inFire(c.x,c.y,ox,oy))c.fire=1;
  for(const g of siege)if(!g.dead&&inFire(g.x,g.y,ox,oy)){if(!g.fire){g.fire=1;float(g.x,g.y-40,'Siege engine ablaze!','#ffb050');}hurtSiege(g,DR.fireDps*.5*dt);}
  for(const u of units)if(!u.dead&&!u.inside&&inFire(u.x,u.y,ox,oy)){u.burn=u.type==='sea'?0:1.4;hurtUnit(u,DR.fireDps*dt,'fire');}
  fireShips(ox,oy,dt);
}
function doStomp(){G.shake=Math.max(G.shake,14);rumble(.9,.6,260);puff(D.x,D.y,40,'rgba(160,140,100,',260,18);
  const r=DR.stompR;let hit=false;HEAVY=true;
  for(const t of trees)if(t.state==='ok'&&dist(t,D)<r*.8){t.state='stump';t.fire=0;t.regrow=90;G.stats.trees++;addAlarm(1.2);hit=true;puff(t.x,t.y,8,'rgba(60,110,40,',90,8);}
  for(const s of structures)if(s.state!=='ruin'&&dist(s,D)<r+18){hurtStruct(s,DR.stompDmg*1.6);hit=true;
    if(s.kind==='stonepile'){const l=Math.min(G.stone,4);G.stone-=l;if(l)float(s.x,s.y-40,`-${l} stone`,'#ddd');}
    if(s.kind==='logpile'){const l=Math.min(G.wood,3);G.wood-=l;if(l)float(s.x,s.y-40,`-${l} wood`,'#e8c090');}}
  HEAVY=false;
  for(const c of cells)if(!c.burnt&&dist(c,D)<r*.8){c.burnt=true;c.flat=true;c.growth=0;G.stats.crops++;addAlarm(.15);}
  for(const c of carts)if(!c.wrecked&&dist(c,D)<r)wreckCart(c);
  for(const g of siege)if(!g.dead&&dist(g,D)<r+20){hurtSiege(g,DR.stompDmg*1.3);hit=true;}
  for(const u of units)if(!u.dead&&!u.inside&&dist(u,D)<r){hurtUnit(u,DR.stompDmg,'stomp');const a=Math.atan2(u.y-D.y,u.x-D.x);u.x+=Math.cos(a)*30;u.y+=Math.sin(a)*30;}
  float(D.x,D.y-90,'STOMP!','#ffe28a');}
function tryEat(){if(tryGrab())return;const r=D.alt<0.3?DR.eatRGround:DR.eatRAir;const mx=D.x+Math.cos(D.ang)*85,my=D.y+Math.sin(D.ang)*85;
  let best=null,bd=1e9;for(const u of units){if(u.dead||u.inside)continue;if(!['villager','animal','crew','archer','knight','hunter','sea'].includes(u.type))continue;if(u.kind==='squid'&&D.alt>.6)continue;if(u.species==='fish'&&!(u.jt>0))continue;
    if(D.alt>=0.3&&D.alt<0.95&&false)continue;const dd=Math.min(d2(u.x,u.y,mx,my),dist(u,D)+12);if(dd<r+(D.alt<.3?0:0)&&dd<bd){bd=dd;best=u;}}
  if(!best){if(tryEatBird())return;if(biteShip())return;}
  if(!best){if(D.alt>=0.3)float(D.x,D.y-90,'Swoop closer to snatch!','#ddd');D.eatCD=.25;return;}
  if(best.species==='bear'&&best.hp>best.maxHp*.5){D.eatCD=.8;D.hp-=5*G.dmgMul;D.hurt=.3;best.angry=3;float(best.x,best.y-40,'The bear wriggles free! Wear it down first','#ffd27a');return;}
  D.eatCD=D.alt<.3?.45:.9;D.eatT=.3;if(best.type==='sea'){eatSea(best);return;}eatUnit(best);}
function stoneish(s){return s.kind==='bridge'&&((s.state!=='building'&&s.mat==='stone')||(s.state==='building'&&s.nextMat==='stone'));}
const HEAL={chicken:5,rabbit:6,sheep:14,pig:16,deer:20,cow:26,villager:10,crew:10,archer:12,knight:18,hunter:18,horse:24,boar:16,fox:8,wolf:12,bear:40,fish:4,beaver:7,mgoat:15,goat:12,crab:3,seal:22,cavalry:40};
// ---- HUNGER (normal mode only): ~80s full->empty on the ground, ~60s flying/breathing fire; starving drains HP ----
const HUNGER={base:1.25,airMul:1.25,breath:.35,maxRate:1.65,low:25,starveHp:2.5,feedMul:2.2,feedMin:6,wetMul:1.4,wetMax:2.3};
function feed(heal){if(G.easy)return;const f=Math.max(HUNGER.feedMin,heal*HUNGER.feedMul),was=D.hunger;D.hunger=Math.min(D.maxHunger,D.hunger+f);
  if(was<=0)float(D.x,D.y-heightOf()-95,'Phew, fed!','#ffd27a');if(D.hunger>HUNGER.low)D.hungryWarn=false;}
function updHunger(dt){if(G.easy||G.over||G.won){D.hunger=D.maxHunger;D.starveT=0;return;}
  const wet=D.swim||D.overWater,rate=Math.min(wet?HUNGER.wetMax:HUNGER.maxRate,(HUNGER.base*(D.mode==='air'?HUNGER.airMul:1)+(D.breath?HUNGER.breath:0))*(wet?HUNGER.wetMul:1));
  D.hunger=Math.max(0,D.hunger-rate*dt);
  if(D.hunger<=HUNGER.low&&D.hunger>0&&!D.hungryWarn){D.hungryWarn=true;float(D.x,D.y-heightOf()-90,'Getting hungry… eat something!','#ffb060');}
  if(D.hunger<=0){D.starveT+=dt;D.hp-=HUNGER.starveHp*dt;D.hurt=Math.max(D.hurt,.05);
    if(Math.floor(D.starveT/3)!==Math.floor((D.starveT-dt)/3))float(D.x,D.y-heightOf()-90,'Starving!','#ff5050');
    if(D.hp<=0){D.hp=0;G.over=true;G.overT=0;G.starved=true;G.score=calcScore();if(G.score>best){best=G.score;localStorage.setItem('dr_best',best);}}}
  else D.starveT=0;}
function eatUnit(u){if(u.type==='sea'){eatSea(u);return;}u.dead=true;u.eaten=true;dropCarry(u);const heal=Math.round((u.type==='animal'?HEAL[u.species]:u.mounted?HEAL.cavalry:HEAL[u.type])||10);if(u.patrol)patrolHit(u);
  const got=Math.min(heal,D.maxHp-D.hp);D.hp=Math.min(D.maxHp,D.hp+heal);D.st=Math.min(D.maxSt,D.st+8);D.healFx=.6;feed(heal);
  puff(u.x,u.y,6,'rgba(170,40,40,',60,5);sparkle(D.x,D.y-heightOf(),14);

  else{G.stats.eaten++;addAlarm(u.type==='villager'?6:3);float(u.x,u.y-20,u.mounted?'Horse and rider? Gulp!':u.type==='knight'?'Crunchy knight!':'Gulp!','#ffd27a');if(u.type==='archer')G.stats.archers++;if(u.type==='knight')G.stats.knights++;}}
function sparkle(x,y,n){for(let i=0;i<n;i++){const a=R(0,TAU),s=R(20,70);parts.push({x:x+R(-30,30),y:y+R(-20,20),z:R(10,50),vx:Math.cos(a)*s,vy:Math.sin(a)*s*.5,vz:R(20,60),life:R(.5,.9),max:.9,size:R(3,6),kind:'sparkle'});}}
function dropCarry(u){if(u.carry==='log'){}u.carry=null;u.water=null;if(u.cart){u.cart.pusher=null;u.cart=null;}if(u.task&&u.task.s){u.task.s.builder=null;}u.task=null;
  if(u.tree){u.tree.claimed=null;u.tree=null;}if(u.cell){u.cell.claimed=null;u.cell=null;}}
function patrolHit(u){const p=u.patrol;if(!p)return;if(!p.hitT||G.t-p.hitT>1){p.hitT=G.t;addAlarm(5);}engagePatrol(p);}
function hurtUnit(u,d,src){if(u.dead)return;if(u.type==='sea'){hurtSea(u,d,src);return;}if(u.patrol)patrolHit(u);u.hp-=d;

function hurtStruct(s,d){if(s.state==='ruin')return;if(stoneish(s)&&!HEAVY)return;if(s.kind==='bridge'&&s.state==='building'&&s.nextMat==='stone'){d*=.5;}if(s.state==='building'){s.state='ruin';s.fire=0;s.build=Math.max(0,s.build-.5);if(s.builder){s.builder.task=null;s.builder.state='idle';s.builder=null;}puff(s.x,s.y,10,'rgba(120,100,70,',90,10);return;}s.hp-=d;

    else if(s.kind==='bridge'){G.stats.bridges++;addAlarm(6);s.upgBy=null;float(s.x,s.y-50,s.mat==='stone'?'The STONE bridge crumbles into the river!':'The bridge burns and collapses!','#ffb050');}
    else if(s.kind==='barracks'){G.stats.castle=(G.stats.castle||0)+1;addAlarm(10);float(s.x,s.y-50,'Barracks destroyed! Fewer, slower knights','#ffb050');}}}
function wreckCart(c){if(c.wrecked)return;c.wrecked=true;c.fire=0;c.t=12;G.stats.carts++;addAlarm(3);G.cartsPool=Math.max(0,G.cartsPool);

function hurtDragon(d,src){if(G.over||G.won)return;d*=G.dmgMul;if(d>=9)rumble(.7,.9,180);D.hp-=d;D.hurt=.25;G.shake=Math.max(G.shake,Math.min(12,d*.6));float(D.x+R(-20,20),D.y-heightOf()-50,'-'+Math.round(d),'#ff7070');
  if(D.hp<=0){D.hp=0;G.over=true;G.overT=0;G.score=calcScore();if(G.score>best){best=G.score;localStorage.setItem('dr_best',best);}}}

function updFire(dt){
  const burning=[];
  for(const t of trees){
    if(t.state==='falling'){t.fallT+=dt;if(t.fallT>1){t.state='stump';t.regrow=80;}}
    else if(t.state==='stump'||t.state==='burnt'){t.regrow-=dt;if(t.regrow<=0&&!t.claimed){t.sapling=t.state==='burnt';t.state='ok';t.hp=40;t.s=t.sapling?.3:.5;}}
    else if(t.state==='ok'&&t.s<1)t.s=Math.min(1.1,t.s+dt*(t.sapling?.01:.02));
    if(t.fire){t.hp-=6*dt;burning.push(t);if(rnd()<dt*6)flame(t.x,t.y-20*t.s,R(10,40));if(rnd()<dt*3)smoke(t.x,t.y-30);
      if(t.hp<=0){t.fire=0;t.state='burnt';t.regrow=70;G.stats.trees++;addAlarm(1.5);scorch(t.x,t.y,16);if(t.claimed){t.claimed.tree=null;t.claimed=null;}}}}
  for(const s of structures)if(s.fire&&s.state!=='ruin'){hurtStruct(s,(s.kind==='stonepile'?5:9)*dt);burning.push(s);
    if(s.kind==='logpile'&&G.wood>0&&rnd()<dt*.8){G.wood--;float(s.x,s.y-40,'-1 wood','#e8c090');}
    for(let i=0;i<2;i++)if(rnd()<dt*8)flame(s.x+R(-22,22),s.y+R(-10,10),R(10,46));if(rnd()<dt*4)smoke(s.x,s.y-40);}
  for(const c of cells){if(c.fire){c.fire+=dt;burning.push(c);if(rnd()<dt*4)flame(c.x,c.y,R(2,14));if(c.fire>2.5){c.fire=0;c.burnt=true;c.growth=0;G.stats.crops++;addAlarm(.25);}}
    else if(!c.burnt&&c.growth<1)c.growth=Math.min(1,c.growth+dt/45);}
  for(const c of carts){if(c.fire&&!c.wrecked){c.fire+=dt;flame(c.x,c.y,10);if(c.fire>2)wreckCart(c);} if(c.wrecked){c.t-=dt;}}
  for(let i=carts.length-1;i>=0;i--)if(carts[i].wrecked&&carts[i].t<=0)carts.splice(i,1);
  for(const g of siege)if(g.fire&&!g.dead){hurtSiege(g,18*dt);if(rnd()<dt*8)flame(g.x+R(-15,15),g.y,R(6,30));}
  // spread
  for(const b of burning){if(rnd()>dt*1.6)continue;
    const near=(o,r)=>Math.abs(o.x-b.x)<r&&Math.abs(o.y-b.y)<r&&d2(o.x,o.y,b.x,b.y)<r;
    for(const t of trees)if(t.state==='ok'&&!t.fire&&near(t,48)&&rnd()<.5)t.fire=1;
    for(const s of structures)if(s.state!=='ruin'&&!s.fire&&!stoneish(s)&&near(s,62)&&rnd()<.35)s.fire=1;
    for(const c of cells)if(!c.burnt&&!c.fire&&c.growth>.15&&near(c,32))c.fire=0.01;}
  for(const u of units)if(u.burn>0&&!u.dead){u.burn-=dt;hurtUnit(u,10*dt,'fire');if(rnd()<dt*10)flame(u.x,u.y,8);}
}

}

  o.type='sawtooth';o2.type='sawtooth';o.frequency.setValueAtTime(196,t);o.frequency.linearRampToValueAtTime(220,t+.25);o.frequency.setValueAtTime(220,t+1.2);o.frequency.linearRampToValueAtTime(196,t+1.6);o2.frequency.value=147;

// ---------- gamepad (standard mapping; works alongside the keyboard) ----------
const GPAD={connected:false,id:'',mx:0,my:0,fire:false,prev:[],toast:null,toastT:0,idx:-1,navT:0};
function showToast(s){GPAD.toast=s;GPAD.toastT=3.5;}
addEventListener('gamepadconnected',e=>{GPAD.connected=true;GPAD.id=e.gamepad.id;showToast('🎮 Controller connected: '+e.gamepad.id.slice(0,40));audio();});
addEventListener('gamepaddisconnected',()=>{GPAD.connected=false;GPAD.mx=GPAD.my=0;GPAD.fire=false;showToast('Controller disconnected');});
function rumble(strong,weak,ms){try{const pads=navigator.getGamepads?navigator.getGamepads():[];for(const p of pads){if(p&&p.vibrationActuator&&p.vibrationActuator.playEffect)
  p.vibrationActuator.playEffect('dual-rumble',{duration:ms,strongMagnitude:strong,weakMagnitude:weak}).catch(()=>{});}}catch(e){}}
function pollPad(dt){GPAD.toastT=Math.max(0,GPAD.toastT-dt);let pads=[];try{pads=navigator.getGamepads?navigator.getGamepads():[];}catch(e){}
  let p=null;for(const q of pads||[])if(q&&q.connected!==false){p=q;break;}
  if(!p){GPAD.mx=GPAD.my=0;GPAD.fire=false;return;}
  if(!GPAD.connected){GPAD.connected=true;GPAD.id=p.id;showToast('🎮 Controller connected: '+String(p.id).slice(0,40));}
  const B=i=>{const b=p.buttons[i];return !!b&&(b.pressed||b.value>.5);},prev=GPAD.prev,edge=i=>B(i)&&!prev[i];
  const menu=scene==='title'||G.over||G.won||paused;
  // movement: left stick (radial deadzone, analog magnitude) or d-pad
  let ax=p.axes[0]||0,ay=p.axes[1]||0;const m=Math.hypot(ax,ay);
  if(m<.2){ax=ay=0;}else{const k=Math.min(1,(m-.2)/.75)/m;ax*=k;ay*=k;}
  const dx=(B(15)?1:0)-(B(14)?1:0),dy=(B(13)?1:0)-(B(12)?1:0);if(dx||dy){const l=Math.hypot(dx,dy);ax=dx/l;ay=dy/l;}
  GPAD.mx=menu?0:ax;GPAD.my=menu?0:ay;
  // buttons -> the same virtual key presses the keyboard uses
  if(menu){if(edge(0))pressed['enter']=true;if(edge(9))pressed[paused&&!G.over&&!G.won&&scene!=='title'?'p':'enter']=true;if(edge(8))pressed['r']=true;if(edge(1)&&paused)pressed['p']=true;
    // d-pad / stick edges navigate menus
    GPAD.navT-=dt;const nx=dx||(Math.abs(ax)>.5?Math.sign(ax):0),ny=dy||(Math.abs(ay)>.5?Math.sign(ay):0);
    if((nx||ny)&&GPAD.navT<=0){GPAD.navT=.28;if(ny<0)pressed['arrowup']=true;else if(ny>0)pressed['arrowdown']=true;else if(nx<0)pressed['arrowleft']=true;else pressed['arrowright']=true;}
    if(!nx&&!ny)GPAD.navT=0;GPAD.fire=false;}
  else{GPAD.fire=B(0)||((p.buttons[7]&&p.buttons[7].value)||0)>.3;if(edge(2))pressed['e']=true;if(edge(1))pressed['q']=true;if(edge(3))pressed['f']=true;if(edge(9))pressed['p']=true;if(edge(8))pressed['r']=true;if(edge(4))pressed['m']=true;}
  GPAD.prev=p.buttons.map((b,i)=>B(i));}

// ---------- castle goal: steal gold, kidnap the princess (cartoon style), fly home ----------
const QUIPS=['Eek! Put me down!','Help! Somebody!','You big lizard!','Daddy will be SO mad!','Watch the dress!','Are we there yet?','I get airsick, you know!'];
function tryGrab(){const mx=D.x+Math.cos(D.ang)*60,my=D.y+Math.sin(D.ang)*60;
  if(PR.state==='tower'&&!D.princess&&(d2(D.x,D.y,PR.x,PR.y)<120||d2(mx,my,PR.x,PR.y)<110)){
    PR.state='carried';D.princess=true;D.quip=QUIPS[0];D.quipT=3;G.quipT=4;addAlarm(100);G.alarm=100;
    float(PR.x,PR.y-60,'Eek! Put me down!','#ff9ad0');spawnWave(Math.max(1,G.level),true);G.banner={text:'The princess has been taken!',sub:'Fly her back to your lair (follow the gold arrow, south-east). She is quite safe — just very cross.',extra:'The whole army rides out of the gate after you!',t:4.5};return true;}
  const cap=G.easy?80:60;
  if(D.gold<cap)for(const g of goldPiles){if(g.amt>0&&(d2(D.x,D.y,g.x,g.y)<95||d2(mx,my,g.x,g.y)<90)){const take=Math.min(g.amt,cap-D.gold);g.amt-=take;D.gold+=take;
    float(g.x,g.y-30,`+${take} gold (carrying ${D.gold})`,'#ffd84a');sparkle(g.x,g.y,8);addAlarm(6);return true;}}
  return false;}
function updGoal(dt){
  // princess quips while carried
  if(D.princess){D.quipT-=dt;G.quipT-=dt;if(G.quipT<=0){G.quipT=4;D.quip=QUIPS[RI(1,QUIPS.length-1)];D.quipT=2.6;}if(D.quipT<=0)D.quip=null;}
  D.healFx=Math.max(0,(D.healFx||0)-dt);
  // deliveries at the lair
  if(!G.over&&!G.won&&d2(D.x,D.y,LAIR.x,LAIR.y)<130){
    if(D.gold>0){G.stash+=D.gold;float(LAIR.x,LAIR.y-60,`Hoard +${D.gold} gold! (+${D.gold*5} bonus)`,'#ffd84a');sparkle(LAIR.x,LAIR.y,16);D.gold=0;}
    if(D.princess){D.princess=false;D.quip=null;PR.state='lair';PR.x=LAIR.x+40;PR.y=LAIR.y;G.won=true;G.wonT=0;G.score=calcScore();
      if(G.score>best){best=G.score;try{localStorage.setItem('dr_best',best);}catch(e){}}rumble(.5,.5,300);}}
  if(G.won)G.wonT+=dt;
  // garrison: tower archers & gate guards are replaced from the barracks
  G.postT-=dt;if(G.postT<=0){G.postT=25;if(castleHealth('barracks')>.3){const lvl=G.lvl;
    const nT=Math.min(TOWER_SPOTS.length,Math.round((G.easy?2:4)+(G.easy?1:2)*(lvl-1))),nG=Math.min(12,Math.round((G.easy?2:3)+(G.easy?1:2)*(lvl-1)));
    for(let i=0;i<nT;i++)if(!units.some(u=>!u.dead&&u.post==='tower'&&u.slot===i))spawnPost('tower',i);
    for(let i=0;i<nG;i++)if(!units.some(u=>!u.dead&&u.post==='guard'&&u.slot===i))spawnPost('guard',i);}}
  // hunter respawns from his cabin
  if(!units.some(u=>!u.dead&&u.type==='hunter')){const cab=structures.find(s=>s.kind==='cabin');if(cab&&cab.state==='ok'){G.hunterT-=dt;if(G.hunterT<=0){G.hunterT=20;spawnHunter();float(CABIN.x,CABIN.y-60,'The hunter is back!','#cde');}}}
  else G.hunterT=20;
  // wild & farmyard animals wander back in
  // (wild animals respawn per region in updFauna)
  if(rnd()<dt*.05){const f=FARMS[RI(0,FARMS.length-1)];const barn=structures.find(s=>s.kind==='barn'&&dist(s,f.barn)<5);if(barn&&barn.state==='ok'&&units.filter(u=>!u.dead&&u.pen===f.yard).length<4)units.push(mkUnit('animal',f.yard.x+R(10,130),f.yard.y+R(8,42),{species:'chicken',pen:f.yard,hp:6,free:true}));}
  updFirefight(dt);}
function nextLevel(){const bank=calcScore();newGame({lvl:G.lvl+1,bank});G.banner={text:`Castle Level ${G.lvl}`,sub:'A tougher castle: thicker gate, more tower archers and guards, more gold.',t:4.5};}

// ---------- the hunter: bow at range (hits air & ground), dagger up close, keeps his distance ----------
function updHunter(u,dt){const dd=dist(u,D);u.atk-=dt;u.shootT-=dt;u.stab=Math.max(0,(u.stab||0)-dt);u.draw=Math.max(0,(u.draw||0)-dt);u.face=D.x>u.x?1:-1;
  if(G.over||G.won||dd>520){moveTo(u,u.home.x+30+Math.sin(G.t*.3+u.id)*60,u.home.y+40+Math.cos(G.t*.4)*40,40,dt);u.mode='bow';return;}
  const ground=D.alt<0.35;
  if(ground&&dd<110){u.mode='dagger';if(dd>60)moveTo(u,D.x,D.y,70,dt);
    if(u.atk<=0&&dd<80){u.atk=.9;u.stab=.25;hurtDragon(6,'dagger');float(D.x,D.y-heightOf()-70,'Stabbed by the hunter!','#ff9a9a');}return;}
  u.mode='bow';
  const a=Math.atan2(u.y-D.y,u.x-D.x);
  if(dd<200){u.x=clamp(u.x+Math.cos(a)*80*dt,WX0+80,WX1-80);u.y=clamp(u.y+Math.sin(a)*80*dt,WY0+80,WY1-80);u.anim+=dt*10;}
  else if(dd>320)moveTo(u,D.x,D.y,62,dt);
  if(u.shootT<=0&&dd<480){u.shootT=1.6;u.draw=.35;const T=dd/460,px=D.x+D.vx*T*.7,py=D.y+D.vy*T*.7,b=Math.atan2(py-u.y,px-u.x);
    projs.push({kind:'arrow',x:u.x,y:u.y,z:12,vx:Math.cos(b)*460,vy:Math.sin(b)*460,tz:heightOf()+15,life:1.4,dmg:6,hunter:true});}}

// ---------- bucket brigade ----------
function nearestWell(x,y){let b=VILLAGES[0],bd=1e18;for(const v of VILLAGES){const d=d2(x,y,v.x,v.y);if(d<bd){bd=d;b=v;}}return b;}
let ffT=0;
function updFirefight(dt){ffT-=dt;if(ffT>0)return;ffT=.5;
  const fires=[...structures.filter(s=>s.fire&&s.state!=='ruin'),...trees.filter(t=>t.fire&&t.state==='ok')];
  for(const f of fires){if(dist(f,D)<320)continue;const n=units.filter(u=>!u.dead&&u.water&&u.water.f===f).length;if(n>=3)continue;
    let best=null,bd=700;for(const u of units){if(u.dead||u.type!=='villager'||u.job!=='peasant'||u.task||u.water||u.state==='flee'||u.inside)continue;const d=d2(u.x,u.y,f.x,f.y);if(d<bd){bd=d;best=u;}}
    if(best){best.water={f,st:'fetch',well:nearestWell(best.x,best.y),t:1};best.carry=null;}}}
function updBucket(u,dt){const w=u.water,f=w.f;const out=f.state==='ruin'||!f.fire||(f.state!==undefined&&f.state!=='ok'&&!f.kind);
  if(out&&w.st!=='fetch'){u.water=null;u.carry=null;u.state='idle';return;}
  if(w.st==='fetch'){if(moveTo(u,w.well.x+12,w.well.y+8,55,dt)){w.t-=dt;if(w.t<=0){w.st='carry';u.carry='bucket';}}}
  else if(w.st==='carry'){if(!f.fire){u.water=null;u.carry=null;return;}if(moveTo(u,f.x+(u.x<f.x?-24:24),f.y+14,55,dt)){w.st='throw';w.t=.5;}}
  else if(w.st==='throw'){w.t-=dt;if(w.t<=0){u.carry=null;puff(f.x,f.y-10,16,'rgba(120,180,255,',120,7,2.5);
      f.water=(f.water||0)+1;const need=f.kind?2:1;
      if(f.water>=need){f.fire=0;f.water=0;float(f.x,f.y-50,'Fire out!','#8fd0ff');G.stats.fires=(G.stats.fires||0)+1;}
      w.st='fetch';w.t=1;w.well=nearestWell(u.x,u.y);if(!f.fire){u.water=null;u.state='idle';}}}}

// ---------- birds: flocks of small birds, pond ducks & geese, field crows, and the odd eagle or hawk ----------
let birds=[],bid=0;
const BIRD={sparrow:{heal:2,pts:10,sp:150,col:'#7a5a3a'},crow:{heal:3,pts:15,sp:120,col:'#1a1a22'},duck:{heal:4,pts:20,sp:115,col:'#5a7a3a'},goose:{heal:6,pts:25,sp:105,col:'#e8e4d8'},gull:{heal:3,pts:15,sp:130,col:'#f4f4f0'},
  hawk:{heal:9,pts:60,sp:200,col:'#8a5a2a',hp:1,dmg:2},eagle:{heal:12,pts:80,sp:190,col:'#4a3020',hp:2,dmg:3}};
function mkBird(kind,x,y,o){return Object.assign({id:++bid,kind,x,y,z:0,vx:0,vy:0,state:'ground',t:R(0,3),flap:R(0,6),hp:BIRD[kind].hp||1,cd:0},o||{});}
function spawnFlock(){const n=RI(6,10),ia=R(0,TAU);let x=D.x+Math.cos(ia)*950,y=D.y+Math.sin(ia)*700;x=clamp(x,WX0+300,WX1-300);y=clamp(y,WY0+300,WY1-300);
  const a=Math.atan2(D.y+R(-300,300)-y,D.x+R(-400,400)-x),f=++bid;for(let i=0;i<n;i++)birds.push(mkBird('sparrow',x+R(-40,40),y+R(-30,30),{state:'fly',z:R(110,140),flock:f,head:a,vx:Math.cos(a)*70,vy:Math.sin(a)*70}));}
function spawnPondBird(p){const k=p.gull?'gull':rnd()<.6?'duck':'goose',a=R(0,TAU);birds.push(mkBird(k,p.x+Math.cos(a)*p.rx*.6,p.y+Math.sin(a)*p.ry*.6,{home:p,hx:0,hy:0}));}
function spawnCrow(){const c=cells.filter(c=>c.state==='ok');if(!c.length)return;const t=c[RI(0,c.length-1)];birds.push(mkBird('crow',t.x+R(-8,8),t.y+R(-6,6),{}));}
let GULLS=[];function gullHomes(){if(GULLS.length)return GULLS;for(const y of[600,1900,3300]){GULLS.push({x:coastX(y)-80,y,rx:60,ry:40,gull:1});}GULLS.push({x:3200,y:coastY(3200)-70,rx:60,ry:40,gull:1});return GULLS;}
function raptorPerches(){const P=[];for(const r of DECOR)if(r.k==='cliff')P.push({x:r.x,y:r.y,z:r.r*.9+8});for(const r of ROCKS)if(r.r>30&&r.x>3300)P.push({x:r.x,y:r.y,z:r.r*.9+8});
  const tall=trees.filter(t=>t.state==='ok'&&t.s>1.05&&t.x<-300);for(let i=0;i<tall.length;i+=Math.max(1,Math.floor(tall.length/6)))P.push({x:tall[i].x,y:tall[i].y,z:46*tall[i].s,tree:tall[i]});return P;}
function spawnRaptor(kind){const all=raptorPerches(),P=all.filter(p=>kind==='eagle'?!p.tree:(!!p.tree||rnd()<.25));const p=P.length?P[RI(0,P.length-1)]:{x:R(2700,3100),y:R(400,1800),z:30};
  birds.push(mkBird(kind,p.x,p.y,{state:'perch',z:p.z,perch:p}));}
function initBirds(){birds=[];for(let i=0;i<4;i++)spawnFlock();
  // start the first flocks already over the map
  const fl={};for(const b of birds){if(!fl[b.flock])fl[b.flock]={x:R(300,WW-300),y:R(400,WH-300)};b.x=fl[b.flock].x+R(-40,40);b.y=fl[b.flock].y+R(-30,30);}
  PONDS.forEach(p=>{for(let i=0;i<(p.lake?7:4);i++)spawnPondBird(p);});gullHomes().forEach(p=>{for(let i=0;i<3;i++)spawnPondBird(p);});for(let i=0;i<9;i++)spawnCrow();
  for(let i=0;i<4;i++)spawnRaptor('eagle');for(let i=0;i<3;i++)spawnRaptor('hawk');}
function updBirds(dt){const dz=heightOf();
  for(const b of birds){if(b.dead)continue;const dd=dist(b,D),spd=BIRD[b.kind].sp;b.flap+=dt*(b.state==='ground'||b.state==='perch'?2:14);b.t-=dt;b.cd-=dt;
    if(b.kind==='sparrow'){ // flock: drift together; scatter away from the dragon, then regroup
      if(dd<220&&!G.over){const a=Math.atan2(b.y-D.y,b.x-D.x)+R(-.6,.6);b.vx=lerp(b.vx,Math.cos(a)*spd,dt*4);b.vy=lerp(b.vy,Math.sin(a)*spd,dt*4);b.z=Math.min(170,b.z+40*dt);b.scared=1.5;}
      else{b.scared=(b.scared||0)-dt;if(rnd()<dt*.15)b.head+=R(-.8,.8);const mates=birds.filter(o=>o.flock===b.flock&&!o.dead);let cx=0,cy=0;for(const o of mates){cx+=o.x;cy+=o.y;}cx/=mates.length;cy/=mates.length;
        const tx=Math.cos(b.head)*70+(cx-b.x)*.8,ty=Math.sin(b.head)*70+(cy-b.y)*.8;b.vx=lerp(b.vx,tx,dt*1.5);b.vy=lerp(b.vy,ty,dt*1.5);b.z=lerp(b.z,125,dt*.5);}
      b.x+=b.vx*dt;b.y+=b.vy*dt;if(dd>1700||b.x<WX0||b.x>WX1||b.y<WY0||b.y>WY1)b.dead=true;continue;}
    if(b.kind==='eagle'||b.kind==='hawk'){updRaptor(b,dt,dd,dz);continue;}
    // ducks, geese & crows: sit, then take off when startled and settle again later
    if(b.state==='ground'){const scare=D.alt>.5?260:200;
      if(b.home){b.hx+=R(-1,1)*dt*20;b.x+=Math.sin(G.t*.7+b.id)*4*dt;b.y+=Math.cos(G.t*.5+b.id)*2*dt;}else if(b.t<=0){b.t=R(.5,2);b.x+=R(-6,6);b.y+=R(-3,3);}
      if(dd<scare&&!G.over){b.state='fly';b.t=R(6,10);const a=Math.atan2(b.y-D.y,b.x-D.x)+R(-.7,.7);b.vx=Math.cos(a)*spd;b.vy=Math.sin(a)*spd;b.honk=1;
        if(rnd()<.3)float(b.x,b.y-20,b.kind==='crow'?'Caw!':b.kind==='goose'?'HONK!':b.kind==='gull'?'Squawk!':'Quack!','#eee');}}
    else{ // flying
      b.z=lerp(b.z,95,dt*1.5);if(dd<200){const a=Math.atan2(b.y-D.y,b.x-D.x);b.vx=lerp(b.vx,Math.cos(a)*spd,dt*2);b.vy=lerp(b.vy,Math.sin(a)*spd,dt*2);}
      if(b.t<=0&&dd>300){const tg=b.home?{x:b.home.x+R(-b.home.rx,b.home.rx)*.6,y:b.home.y+R(-b.home.ry,b.home.ry)*.6}:(b.tgt||(b.tgt=(()=>{const c=cells.filter(c=>c.state==='ok');return c.length?c[RI(0,c.length-1)]:{x:b.x,y:b.y};})()));
        const a=Math.atan2(tg.y-b.y,tg.x-b.x),d=Math.hypot(tg.x-b.x,tg.y-b.y);b.vx=lerp(b.vx,Math.cos(a)*Math.min(spd,d*1.5),dt*2);b.vy=lerp(b.vy,Math.sin(a)*Math.min(spd,d*1.5),dt*2);
        if(d<40){b.z=Math.max(0,b.z-140*dt);if(b.z<=1&&d<14){b.state='ground';b.z=0;b.vx=b.vy=0;b.tgt=null;}}}
      b.x=clamp(b.x+b.vx*dt,WX0+20,WX1-20);b.y=clamp(b.y+b.vy*dt,WY0+20,WY1-20);}}
  for(let i=birds.length-1;i>=0;i--)if(birds[i].dead)birds.splice(i,1);
  // respawning
  G.birdT=(G.birdT||0)-dt;if(G.birdT<=0){G.birdT=12;const fl=new Set(birds.filter(b=>b.kind==='sparrow').map(b=>b.flock));if(fl.size<4)spawnFlock();

function update(dt){G.t+=dt;G.fc++;if(P('m'))G.bigMap=!G.bigMap;G.shake=Math.max(0,G.shake-dt*30);if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}

  for(const u of units){if(u.dead)continue;
    if(u.type==='sea'){const far=Math.abs(u.x-D.x)>2000||Math.abs(u.y-D.y)>1600;if(far&&u.kind!=='squid'){if((G.fc+((u.id*97)|0))%6)continue;updSeaUnit(u,dt*6);continue;}updSeaUnit(u,dt);continue;}

  updProjs(dt);updParts(dt);if(GFX_HI)gfxTick(dt);}
function frame(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
