  try{const s=getComputedStyle(document.getElementById('safe'));SAFE.t=(parseFloat(s.paddingTop)||0)/UIS;SAFE.r=(parseFloat(s.paddingRight)||0)/UIS;SAFE.b=(parseFloat(s.paddingBottom)||0)/UIS;SAFE.l=(parseFloat(s.paddingLeft)||0)/UIS;}catch(e){}}

const WW=3200,WH=2200;
const TAU=Math.PI*2;
const rnd=Math.random, R=(a,b)=>a+rnd()*(b-a), RI=(a,b)=>Math.floor(R(a,b+1));

const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
let seed=1337; const srnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};

 {v:4,field:{x:1980,y:1800,w:240,h:170,crop:'wheat'},barn:{x:2600,y:1760},pen:{x:2560,y:1850,w:160,h:110,animal:'sheep'}},
 {v:5,field:{x:760,y:2620,w:240,h:160,crop:'wheat'},barn:{x:300,y:2600},pen:{x:230,y:2930,w:150,h:110,animal:'sheep'}},
 {v:6,field:{x:2550,y:3050,w:220,h:150,crop:'corn'},barn:{x:2150,y:3080},pen:{x:2560,y:2640,w:150,h:110,animal:'pig'}},
 {v:7,field:{x:1000,y:3950,w:260,h:160,crop:'wheat'},barn:{x:520,y:4000},pen:{x:400,y:4200,w:150,h:110,animal:'cow'}},
 {v:8,field:{x:3250,y:3930,w:240,h:170,crop:'corn'},barn:{x:2800,y:3880},pen:{x:2790,y:4030,w:160,h:110,animal:'sheep'}},
];

// ---------- state ----------
let PR, goldPiles, G, D, structures, trees, cells, units, siege, projs, boulders, carts, parts, texts, ground, gctx;

function newGame(opt){opt=opt||{};const lvl=opt.lvl||1;
  seed=1337;
  G={lvl,bank:opt.bank||0,easy:EASY,dmgMul:EASY?.55:1,alarmMul:EASY?.75:1,waveMul:(EASY?.5:1)*(1+.25*(lvl-1)),gold:0,stash:0,won:false,wonT:0,spawnQ:[],spawnQT:0,gateOpenT:0,postT:0,hunterT:3,quipT:0,
     t:0,alarm:0,level:0,lastLevel:0,sinceDmg:99,waveNum:0,waveCD:0,reinforceT:0,banner:null,shake:0,
     wood:8,stone:4,cartsPool:3,cartBuildT:0,spawnT:0,rebuildT:0,
     visited:{},region:null,regCand:null,regCandT:0,fc:0,patrolT:20,packAngry:{},faunaT:5,regBanner:null,
     stats:{regions:0,bridges:0,huts:0,barns:0,trees:0,crops:0,eaten:0,animals:0,knights:0,archers:0,siege:0,carts:0,piles:0,ships:0,pirates:0,squid:0,seaPts:0},score:0,over:false,overT:0,msg:null};
  D={x:LAIR.x,y:LAIR.y+150,vx:0,vy:0,ang:-Math.PI/2,alt:0,altT:0,mode:"ground",hp:EASY?360:220,maxHp:EASY?360:220,gold:0,princess:false,st:100,maxSt:100,
     breath:false,stompCD:0,stompT:0,eatCD:0,eatT:0,hurt:0,walkT:0,flapT:0,landDust:false,hunger:100,maxHunger:100,starveT:0,hungryWarn:false};
  structures=[];trees=[];cells=[];units=[];siege=[];projs=[];boulders=[];carts=[];parts=[];texts=[];ROCKS.length=0;patrols=[];FARSCORCH.length=0;
  // villages
  VILLAGES.forEach((v,vi)=>{const n=7+Math.floor(SR(0,3));for(let i=0;i<n;i++){const a=i/n*TAU+SR(-.2,.2),r=SR(70,170);
    addStruct('hut',v.x+Math.cos(a)*r,v.y+Math.sin(a)*r*0.8,vi);} });
  FARMS.forEach((f,fi)=>{const s=addStruct('barn',f.barn.x,f.barn.y,f.v);s.farm=fi;
    const F=f.field;for(let y=F.y;y<F.y+F.h;y+=22)for(let x=F.x;x<F.x+F.w;x+=22)cells.push({x:x+11,y:y+11,crop:F.crop,growth:SR(.7,1),fire:0,burnt:false,farm:fi,claimed:null});});
  addStruct('logpile',LOGPILE_POS.x,LOGPILE_POS.y,-1);
  addStruct('cabin',CABIN.x,CABIN.y,-1);
  const gt=addStruct('gate',GATE.x,CWALL.y1+6,-1);gt.hp=gt.maxHp=260+80*(lvl-1);
  const br=addStruct('barracks',1430+CDX,250+CDY,-1);br.hp=br.maxHp=220+60*(lvl-1);
  PR={x:KEEP_POS.x,y:KEEP_POS.y-30,state:'tower',quip:0,t:0}; // state 'tower' = held in the castle (inside the keep)
  goldPiles=[[1480,150],[1560,215],[1650,150],[1700,240],[1620,265]].map(([x,y])=>({x:x+CDX,y:y+CDY,amt:20+10*(lvl-1)}));
  addStruct('stonepile',STONEPILE_POS.x,STONEPILE_POS.y,-1);
  // rocks / hills in the east
  for(let i=0;i<46;i++){const x=SR(2680,3150),y=SR(950,1650);if(d2(x,y,MINE.x,MINE.y)<70)continue;ROCKS.push({x,y,r:SR(14,40),c:SR(0,1)});}
  for(let i=0;i<300;i++){const x=SR(3250,5300),y=SR(-150,3000);if(regionKey(x,y)!=='hills'||VILLAGES.some(v=>d2(x,y,v.x,v.y)<260)||d2(x,y,LAIR.x,LAIR.y)<450)continue;ROCKS.push({x,y,r:SR(14,44),c:SR(0,1)});}
  // trees: dense west forest + scattered
  const blocked=(x,y)=>{ if(x>CASTLE.x-CASTLE.w/2-80&&x<CASTLE.x+CASTLE.w/2+80&&y>CASTLE.y-CASTLE.h/2-120&&y<CASTLE.y+CASTLE.h/2+120)return true;
    if(x>GATE.x-260&&x<GATE.x+380&&y>GATE.y&&y<GATE.y+240)return true; // gate plaza, guards and the Castle Market
    for(const v of VILLAGES)if(d2(x,y,v.x,v.y)<210)return true;
    for(const f of FARMS){const F=f.field;if(x>F.x-30&&x<F.x+F.w+30&&y>F.y-30&&y<F.y+F.h+30)return true;
      const P=f.pen;if(x>P.x-30&&x<P.x+P.w+30&&y>P.y-30&&y<P.y+P.h+30)return true;if(d2(x,y,f.barn.x,f.barn.y)<70)return true;}
    if(x>2650&&y>920&&y<1680)return true; if(d2(x,y,CAMP.x,CAMP.y)<90||d2(x,y,LOGPILE_POS.x,LOGPILE_POS.y)<70)return true;
    if(d2(x,y,1600,1450)<120)return true; if(PONDS.some(p=>d2(x,y,p.x,p.y)<110))return true; if(inWater(x,y)||riverD(x,y)<RIVW+40||onBeach(x,y))return true;
    {const lx=(x-LAKE.x)/(LAKE.rx+70),ly=(y-LAKE.y)/(LAKE.ry+70);if(lx*lx+ly*ly<1)return true;} if(PADDOCKS.some(P=>x>P.x-30&&x<P.x+P.w+30&&y>P.y-30&&y<P.y+P.h+30))return true; if(d2(x,y,LAIR.x,LAIR.y)<170||d2(x,y,CABIN.x,CABIN.y)<75)return true; return false;};
  let tries=0;while(trees.length<240&&tries<5000){tries++;const x=SR(40,430),y=SR(300,2150);if(!blocked(x,y))addTree(x,y);}
  tries=0;while(trees.length<262&&tries<900){tries++;const x=SR(1250,1960),y=SR(120,440);if(!blocked(x,y)&&!(y<frostY(x)+60))addTree(x,y);} // a little wood where the old castle used to stand
  tries=0;while(trees.length<442&&tries<5000){tries++;const x=SR(40,WW-40),y=SR(420,WH-40);if(!blocked(x,y))addTree(x,y);}
  for(let i=0;i<30;i++){const x=CAMP.x+SR(-180,60),y=CAMP.y+SR(-260,260);if(!blocked(x,y)&&x<480)addTree(x,y);}
  // the Deepwood (far west), scattered southern copses and a few hill trees
  tries=0;let nt=trees.length;while(trees.length<nt+900&&tries<9000){tries++;const x=SR(-2900,-250),y=SR(-150,4300);if(regionKey(x,y)==='forest'&&!blocked(x,y))addTree(x,y);}
  tries=0;nt=trees.length;while(trees.length<nt+160&&tries<4000){tries++;const x=SR(-200,5200),y=SR(2250,4300);const k=regionKey(x,y);if((k==='south'||k==='farm')&&!blocked(x,y)&&(x<0||x>WW||y>WH))addTree(x,y);}
  tries=0;nt=trees.length;while(trees.length<nt+50&&tries<2000){tries++;const x=SR(3250,5200),y=SR(-100,3000);if(regionKey(x,y)==='hills'&&!blocked(x,y)&&d2(x,y,LAIR.x,LAIR.y)>420)addTree(x,y);}
  addBridges();
  // people

  for(let i=0;i<3;i++)spawnVillager(CAMP.x+R(-20,20),CAMP.y+R(-20,20),'woodcutter',0);
  for(let i=0;i<3;i++)spawnVillager(MINE.x-60+R(-20,20),MINE.y+40,'miner',1);
  FARMS.forEach((f,fi)=>{for(let k=0;k<2;k++){const u=spawnVillager(f.field.x+20+k*40,f.field.y+20,'farmer',f.v);u.farm=fi;}
    const P=f.pen,n=P.cap=preyN('pen'+FARMS.indexOf(f),f.pen.animal==='cow'?3:4);for(let i=0;i<n;i++)units.push(mkUnit('animal',P.x+R(15,P.w-15),P.y+R(15,P.h-15),{species:P.animal,pen:P,hp:14}));});

  initStructsK();
  buildGround();buildTerrain();initFog();initSea();cam.x=D.x;cam.y=D.y;

function addStruct(kind,x,y,v){const hp={hut:90,barn:170,logpile:110,stonepile:140,cabin:120,gate:260,barracks:220,bridge:120}[kind];
  const s={kind,x,y,v,hp,maxHp:hp,fire:0,state:'ok',build:0,builder:null,id:Math.random()};structures.push(s);return s;}
function addTree(x,y){trees.push({x,y,hp:40,fire:0,state:'ok',s:SR(.8,1.25),fallT:0,fallA:0,regrow:0,claimed:null,hue:SR(0,1)});}
function mkUnit(type,x,y,o){return Object.assign({type,x,y,vx:0,vy:0,hp:10,maxHp:10,burn:0,state:'idle',t:0,anim:0,face:1,id:Math.random(),dead:false},o||{});}
function spawnVillager(x,y,job,v){const u=mkUnit('villager',x,y,{job,v,hp:10,maxHp:10,home:VILLAGES[Math.max(0,v)]||VILLAGES[0],shirt:['#b5523b','#3f6fb5','#6a8f3a','#a07a2a','#8a4f9e'][RI(0,4)]});units.push(u);return u;}

function buildGround(){
  ground=document.createElement('canvas');ground.width=WW;ground.height=WH;gctx=ground.getContext('2d');
  const g=gctx;
  for(let i=0;i<2600;i++){g.fillStyle=srnd()<.5?'rgba(80,130,50,.35)':'rgba(120,160,70,.25)';g.beginPath();g.ellipse(SR(0,WW),SR(0,WH),SR(10,60),SR(6,30),SR(0,3),0,TAU);g.fill();}
  // forest floor
  g.fillStyle='rgba(40,70,30,.45)';g.beginPath();g.ellipse(230,1250,330,1000,0,0,TAU);g.fill();
  // rocky hills
  g.fillStyle='#8a7d68';g.beginPath();g.ellipse(2930,1300,330,400,0,0,TAU);g.fill();
  g.fillStyle='rgba(110,100,85,.6)';for(let i=0;i<200;i++){g.beginPath();g.arc(SR(2650,3200),SR(950,1650),SR(3,14),0,TAU);g.fill();}
  // dirt roads (A*-routed network, see partR)
  strokeRoads(g);
  VILLAGES.forEach(v=>{g.fillStyle='#a8915f';g.beginPath();g.ellipse(v.x,v.y,120,90,0,0,TAU);g.fill();});
  // fields soil
  FARMS.forEach(f=>{const F=f.field;g.fillStyle='#7a5a32';g.fillRect(F.x-4,F.y-4,F.w+8,F.h+8);
    const P=f.pen;g.fillStyle='#7fa84a';g.fillRect(P.x,P.y,P.w,P.h);});
  // camp clearing, mine yard
  g.fillStyle='#9a8256';g.beginPath();g.ellipse(CAMP.x+30,CAMP.y+30,120,110,0,0,TAU);g.fill();
  g.beginPath();g.ellipse(2760,1330,140,90,0,0,TAU);g.fill();
  // castle grounds, courtyard flagstones, roads to lair & cabin
  // (the castle grounds are painted into the world terrain now that Castle Aldric stands in the south; see buildTerrain)
  g.fillStyle='rgba(40,70,30,.4)';g.beginPath();g.ellipse(CABIN.x,CABIN.y,90,70,0,0,TAU);g.fill();
  g.fillStyle='#8a7a62';g.beginPath();g.ellipse(CABIN.x+10,CABIN.y+20,60,40,0,0,TAU);g.fill();
  g.fillStyle='#5a4a3a';g.beginPath();g.ellipse(LAIR.x,LAIR.y,170,120,0,0,TAU);g.fill();g.fillStyle='#6e5d48';g.beginPath();g.ellipse(LAIR.x,LAIR.y,130,90,0,0,TAU);g.fill();
  // ponds (ducks & geese)
  PONDS.forEach(p=>{g.fillStyle='#4a6a3a';g.beginPath();g.ellipse(p.x,p.y,p.rx+10,p.ry+8,0,0,TAU);g.fill();g.fillStyle='#3a6aa8';g.beginPath();g.ellipse(p.x,p.y,p.rx,p.ry,0,0,TAU);g.fill();
    g.fillStyle='rgba(255,255,255,.18)';g.beginPath();g.ellipse(p.x-p.rx*.3,p.y-p.ry*.3,p.rx*.4,p.ry*.25,0,0,TAU);g.fill();});
  // (wells are stone structures now: see placeWells)
}

const GPAD={connected:false,id:'',mx:0,my:0,fire:false,prev:[],toast:null,toastT:0,idx:-1,navT:0};

addEventListener('gamepaddisconnected',()=>{GPAD.connected=false;GPAD.mx=GPAD.my=0;GPAD.fire=false;showToast('Controller disconnected');});

  p.vibrationActuator.playEffect('dual-rumble',{duration:ms,strongMagnitude:strong,weakMagnitude:weak}).catch(()=>{});}}catch(e){}}
function pollPad(dt){GPAD.toastT=Math.max(0,GPAD.toastT-dt);let pads=[];try{pads=navigator.getGamepads?navigator.getGamepads():[];}catch(e){}
  let p=null;for(const q of pads||[])if(q&&q.connected!==false){p=q;break;}
  if(!p){GPAD.mx=GPAD.my=0;GPAD.fire=false;return;}
  if(!GPAD.connected){GPAD.connected=true;GPAD.id=p.id;showToast('🎮 Controller connected: '+String(p.id).slice(0,40));}
  const B=i=>{const b=p.buttons[i];return !!b&&(b.pressed||b.value>.5);},prev=GPAD.prev,edge=i=>B(i)&&!prev[i];
  const menu=scene==='title'||G.over||G.won||paused;
  // movement: left stick (radial deadzone, analog magnitude) or d-pad
  let ax=p.axes[0]||0,ay=p.axes[1]||0;const m=Math.hypot(ax,ay);
  if(m<.2){ax=ay=0;}else{const k=Math.min(1,(m-.2)/.75)/m;ax*=k;ay*=k;}
  const dx=(B(15)?1:0)-(B(14)?1:0),dy=(B(13)?1:0)-(B(12)?1:0);if(dx||dy){const l=Math.hypot(dx,dy);ax=dx/l;ay=dy/l;}
  GPAD.mx=menu?0:ax;GPAD.my=menu?0:ay;
  // buttons -> the same virtual key presses the keyboard uses
  if(menu){if(edge(0))pressed['enter']=true;if(edge(9))pressed[paused&&!G.over&&!G.won&&scene!=='title'?'p':'enter']=true;if(edge(8))pressed['r']=true;if(edge(1)&&(paused||PM.on))pressed['p']=true;
    // d-pad / stick edges navigate menus
    GPAD.navT-=dt;const nx=dx||(Math.abs(ax)>.5?Math.sign(ax):0),ny=dy||(Math.abs(ay)>.5?Math.sign(ay):0);
    if((nx||ny)&&GPAD.navT<=0){GPAD.navT=.28;if(ny<0)pressed['arrowup']=true;else if(ny>0)pressed['arrowdown']=true;else if(nx<0)pressed['arrowleft']=true;else pressed['arrowright']=true;}
    if(!nx&&!ny)GPAD.navT=0;GPAD.fire=false;}
  else{GPAD.fire=B(0)||((p.buttons[7]&&p.buttons[7].value)||0)>.3;if(edge(2))pressed['e']=true;if(edge(1))pressed['q']=true;if(edge(3))pressed['f']=true;if(edge(9))pressed['p']=true;if(edge(8))pressed['r']=true;if(edge(4))pressed['m']=true;}
  GPAD.prev=p.buttons.map((b,i)=>B(i));}

const QUIPS=['Eek! Put me down!','Help! Somebody!','You big lizard!','Daddy will be SO mad!','Watch the dress!','Are we there yet?','I get airsick, you know!'];
function tryGrab(){const mx=D.x+Math.cos(D.ang)*60,my=D.y+Math.sin(D.ang)*60;
  const nearPR=PR.state==='tower'&&!D.princess&&(d2(D.x,D.y,PR.x,PR.y)<120||d2(mx,my,PR.x,PR.y)<110);
  if(nearPR&&!roofOpen()){if(biteRoof())return true;roofHint(true);}
  if(nearPR&&roofOpen()){
    PR.state='carried';D.princess=true;D.quip=QUIPS[0];D.quipT=3;G.quipT=4;addAlarm(100);G.alarm=100;
    float(PR.x,PR.y-60,'Eek! Put me down!','#ff9ad0');spawnWave(Math.max(1,G.level),true);G.banner={text:'You captured Princess Elizabeth!',sub:'Fly her back to your lair (follow the gold arrow, north to Dragon Peak). She is quite safe — just very cross.',extra:'The knights ride out of the gate: "Rescue Princess Elizabeth!"',t:4.5};return true;}
  const cap=G.easy?80:60;

  return false;}

    if(D.gold>0){hoardDrop(D.gold,D.x,D.y);G.stash+=D.gold;float(LAIR.x,LAIR.y-60,`Hoard +${D.gold} gold! (+${D.gold*5} bonus)`,'#ffd84a');sparkle(LAIR.x,LAIR.y,16);D.gold=0;}

      if(G.score>best){best=G.score;try{localStorage.setItem('dr_best',best);}catch(e){}}rumble(.5,.5,300);}}
  if(G.won)G.wonT+=dt;

    const nT=Math.min(TOWER_SPOTS.length,Math.round((G.easy?2:4)+(G.easy?1:2)*(lvl-1))),nG=Math.min(12,Math.round((G.easy?2:3)+(G.easy?1:2)*(lvl-1)));

  // hunter respawns from his cabin

  else G.hunterT=20;

    let best=null,bd=700;for(const u of units){if(u.dead||u.type!=='villager'||u.job!=='peasant'||u.task||u.water||u.state==='flee'||u.inside)continue;const d=d2(u.x,u.y,f.x,f.y);if(d<bd){bd=d;best=u;}}

function updBucket(u,dt){const w=u.water,f=w.f;const out=f.state==='ruin'||!f.fire||(f.state!==undefined&&f.state!=='ok'&&!f.kind);

  else if(w.st==='carry'){if(!f.fire){u.water=null;u.carry=null;return;}if(moveTo(u,f.x+(u.x<f.x?-24:24),f.y+14,55,dt)){w.st='throw';w.t=.5;}}

// ---------- birds: flocks of small birds, pond ducks & geese, field crows, and the odd eagle or hawk ----------
let birds=[],bid=0;

function mkBird(kind,x,y,o){return Object.assign({id:++bid,kind,x,y,z:0,vx:0,vy:0,state:'ground',t:R(0,3),flap:R(0,6),hp:BIRD[kind].hp||1,cd:0},o||{});}

let GULLS=[];function gullHomes(){if(GULLS.length)return GULLS;for(const y of[600,1900,3300]){GULLS.push({x:coastX(y)-80,y,rx:60,ry:40,gull:1});}GULLS.push({x:3200,y:coastY(3200)-70,rx:60,ry:40,gull:1});return GULLS;}
function raptorPerches(){const P=[];for(const r of DECOR)if(r.k==='cliff')P.push({x:r.x,y:r.y,z:r.r*.9+8});for(const r of ROCKS)if(r.r>30&&r.x>3300)P.push({x:r.x,y:r.y,z:r.r*.9+8});

function updBirds(dt){const dz=heightOf();
  for(const b of birds){if(b.dead)continue;const dd=dist(b,D),spd=BIRD[b.kind].sp;b.flap+=dt*(b.state==='ground'||b.state==='perch'?2:14);b.t-=dt;b.cd-=dt;
    if(b.kind==='sparrow'){ // flock: drift together; scatter away from the dragon, then regroup
      if(dd<220&&!G.over){const a=Math.atan2(b.y-D.y,b.x-D.x)+R(-.6,.6);b.vx=lerp(b.vx,Math.cos(a)*spd,dt*4);b.vy=lerp(b.vy,Math.sin(a)*spd,dt*4);b.z=Math.min(170,b.z+40*dt);b.scared=1.5;}
      else{b.scared=(b.scared||0)-dt;if(rnd()<dt*.15)b.head+=R(-.8,.8);const mates=birds.filter(o=>o.flock===b.flock&&!o.dead);let cx=0,cy=0;for(const o of mates){cx+=o.x;cy+=o.y;}cx/=mates.length;cy/=mates.length;

      if(b.home){b.hx+=R(-1,1)*dt*20;b.x+=Math.sin(G.t*.7+b.id)*4*dt;b.y+=Math.cos(G.t*.5+b.id)*2*dt;}else if(b.t<=0){b.t=R(.5,2);b.x+=R(-6,6);b.y+=R(-3,3);}
      if(dd<scare&&!G.over){b.state='fly';b.t=R(6,10);const a=Math.atan2(b.y-D.y,b.x-D.x)+R(-.7,.7);b.vx=Math.cos(a)*spd;b.vy=Math.sin(a)*spd;b.honk=1;
        if(rnd()<.3)float(b.x,b.y-20,b.kind==='crow'?'Caw!':b.kind==='goose'?'HONK!':b.kind==='gull'||b.kind==='parrot'?'Squawk!':b.kind==='toucan'?'Croak-croak!':'Quack!','#eee');}}
    else{ // flying
      b.z=lerp(b.z,95,dt*1.5);if(dd<200){const a=Math.atan2(b.y-D.y,b.x-D.x);b.vx=lerp(b.vx,Math.cos(a)*spd,dt*2);b.vy=lerp(b.vy,Math.sin(a)*spd,dt*2);}
      if(b.t<=0&&dd>300){const tg=b.home?{x:b.home.x+R(-b.home.rx,b.home.rx)*.6,y:b.home.y+R(-b.home.ry,b.home.ry)*.6}:(b.tgt||(b.tgt=(()=>{const c=cells.filter(c=>c.state==='ok');return c.length?c[RI(0,c.length-1)]:{x:b.x,y:b.y};})()));
        const a=Math.atan2(tg.y-b.y,tg.x-b.x),d=Math.hypot(tg.x-b.x,tg.y-b.y);b.vx=lerp(b.vx,Math.cos(a)*Math.min(spd,d*1.5),dt*2);b.vy=lerp(b.vy,Math.sin(a)*Math.min(spd,d*1.5),dt*2);

      b.x=clamp(b.x+b.vx*dt,WX0+20,WX1-20);b.y=clamp(b.y+b.vy*dt,WY0+20,WY1-20);}}
  for(let i=birds.length-1;i>=0;i--)if(birds[i].dead)birds.splice(i,1);

// ---------- kingdom concern: damage near Castle Aldric alarms the kingdom far more than mischief at the edges of the world ----------
function kingdomMul(x,y){const dx=x-CASTLE.x,dy=y-CASTLE.y;const d=Math.hypot(dx,dy);
  if(x>CWALL.x0-120&&x<CWALL.x1+120&&y>CWALL.y0-120&&y<CWALL.y1+160)return 2;            // castle grounds
  return clamp(.2+1.8*Math.exp(-Math.pow(d/2200,1.6)),.2,2);}
function concern(){const k=kingdomMul(D.x,D.y);return k>=1.2?{name:'HIGH',k,col:'#ff9a7a'}:k>=.6?{name:'Med',k,col:'#ffe08a'}:{name:'Low',k,col:'#9fe0a0'};}
function coolMul(){return clamp(1/kingdomMul(D.x,D.y),.5,3);}          // ~0.5x next to the castle up to 3x at the far edges
function coolDelay(){return clamp(1+2.5*kingdomMul(D.x,D.y),1.5,6);}     // and cooling starts sooner when you're far away
function giveUpT(){return clamp(2+5*kingdomMul(D.x,D.y),3,12);}         // chasers lose interest sooner far from the castle          // the meter cools faster when the dragon is far away
function waveNear(){return clamp(.55+.35*kingdomMul(D.x,D.y),.62,1.25);} // waves are bigger when you threaten the castle
function musterNear(){return clamp(1.3-.25*kingdomMul(D.x,D.y),.8,1.25);} // and the knights ride out faster
// ---------- wild vs farm animals (only livestock and people bother the kingdom) ----------
const LIVESTOCK=new Set(['cow','pig','sheep','chicken','horse']);

// ---------- soldiers vs water ----------
function isSoldier(u){return u.militia||u.type==='knight'||u.type==='archer'||u.type==='crew'||u.kind==='scorpion'||u.kind==='catapult';}
const soldierWet=(x,y)=>(inSea(x,y)||inLake(x,y)||riverD(x,y)<RIVW-6)&&!onBridge(x,y);
// the target is out in the water: walk to the shore, then wait there (pacing a little) instead of wading in
function shoreHold(u,tx,ty,sp,dt){const a=Math.atan2(ty-u.y,tx-u.x),look=34;
  if(!soldierWet(u.x+Math.cos(a)*look,u.y+Math.sin(a)*look))return false; // still dry ahead: keep walking normally
  u.face=tx>u.x?1:-1;u.shore=G.t;u.pace=(u.pace||0)+dt;const p=Math.sin(u.pace*.8+((u.id*50)|0))*.5;
  const px=u.x-Math.sin(a)*sp*.25*p*dt,py=u.y+Math.cos(a)*sp*.25*p*dt;if(!soldierWet(px,py)&&!soldierWet(px+Math.cos(a)*20,py+Math.sin(a)*20)){u.x=px;u.y=py;}
  if(u.type!=='crew'&&(!u.shoreMsg||G.t-u.shoreMsg>14)&&Math.random()<.02&&dist(u,D)<700){u.shoreMsg=G.t;float(u.x,u.y-40,['Come out and fight, coward!','We can\'t swim in this armour!','Wait for it on the beach!','Somebody fetch a boat!'][RI(0,3)],'#ffe0a0');}
  return true;}
function dryNear(x,y){for(let r=16;r<=480;r+=16)for(let k=0;k<16;k++){const a=k/16*TAU,px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;if(!soldierWet(px,py)&&!soldierWet(px+12,py)&&!soldierWet(px-12,py))return{x:px,y:py};}return null;}
// knocked into the water (stomp, landing blast, lance recoil): flounder, then get hauled back to the bank, or bob away cartoon-style
function soldierSwim(u,dt){if(!isSoldier(u)||!soldierWet(u.x,u.y)){u.flT=0;return false;}
  if(!u.flT){u.flT=1.3;u.flounder=1;puff(u.x,u.y,10,'rgba(220,240,255,',90,6);if(typeof SFX!=='undefined')SFX.play('splash',u.x,u.y,.7);if(dist(u,D)<800)float(u.x,u.y-34,['Glub! Can\'t swim!','Help! My armour!','Blub blub!'][RI(0,2)],'#bfe6ff');}

  const rp=roadPath(u.x,u.y,site.x,site.y),P=[];if(rp&&rp.P)for(const p of rp.P)P.push({x:p.x,y:p.y});P.push({x:site.x,y:site.y});

  if(site.job==='hunter'){u.dead=true;u.gone=true;const h=spawnHunter();h.x=u.x;h.y=u.y;if(dist(h,D)<1600)float(h.x,h.y-30,'A new hunter takes up the bow and dagger!','#cde');return;}

  else{u.job=site.job;if(site.v>=0){u.v=site.v;u.home=VILLAGES[site.v]||u.home;}if(site.job==='farmer')u.farm=site.farm;}

// save / load support
function wkSave(){return WK.map(s=>{const c=wkCount(s);return{id:s.id,down:s.down,refill:s.refill,cd:s.cd,n:c.n,w:c.w};});}
function wkLoad(arr){WK=wkSites();if(!Array.isArray(arr))return;for(const a of arr){const s=WK.find(x=>x.id===a.id);if(!s)continue;
    s.down=!!a.down;s.refill=!!a.refill||a.w>0;s.cd=Math.min(+a.cd||0,WK_GAP);
    let extra=wkCount(s).n-(+a.n||0);if(extra>0)for(const u of units){if(extra<=0)break;if(wkIsWorker(u,s)){u.dead=true;u.gone=true;extra--;}}
    if(s.refill&&wkCount(s).n<s.need)s.cd=Math.min(s.cd,WK_FIRST);}
  for(let i=units.length-1;i>=0;i--)if(units[i].gone&&units[i].dead)units.splice(i,1);}
// ================= partSV: SAVE / LOAD (3 slots + autosave, localStorage) =================
const SAVE_V=1,SAVE_MIN=1,SAVE_KEYS=[['dr_save_auto','Autosave',1],['dr_save_1','Slot 1'],['dr_save_2','Slot 2'],['dr_save_3','Slot 3']],AUTOSAVE_EVERY=120;
let svCache=null,svCacheT=0,svAutoT=0;
const svIsPlain=o=>{const p=Object.getPrototypeOf(o);return p===Object.prototype||p===null;};
const svNum=v=>typeof v==='number'?(isFinite(v)?Math.round(v*1000)/1000:0):v;
// copy only primitives, flat arrays of primitives and flat plain objects of primitives (never live references to units etc.)
function svFlat(o,skip){const r={};for(const k in o){if(skip&&skip.includes(k))continue;const v=o[k];const t=typeof v;
    if(t==='number'||t==='string'||t==='boolean'||v===null)r[k]=svNum(v);
    else if(t==='object'){if(Array.isArray(v)){if(v.every(x=>x===null||typeof x!=='object'))r[k]=v.map(svNum);}
      else if(svIsPlain(v)){let ok=true;const c={};for(const j in v){const w=v[j],tw=typeof w;if(w!==null&&(tw==='object'||tw==='function')){ok=false;break;}c[j]=svNum(w);}if(ok)r[k]=c;}}}return r;}
function svPrim(o,skip){const r={};for(const k in o){if(skip&&skip.includes(k))continue;const v=o[k],t=typeof v;if(t==='number'||t==='string'||t==='boolean'||v===null)r[k]=svNum(v);}return r;}
const TREE_C={ok:'o',burnt:'b',falling:'s',stump:'s',gone:'g'},TREE_S={o:'ok',b:'burnt',s:'stump',g:'gone'};
function svFog(){let s='';for(let i=0;i<FOG.length;i+=4)s+=((FOG[i]?1:0)|(FOG[i+1]?2:0)|(FOG[i+2]?4:0)|(FOG[i+3]?8:0)).toString(16);return s;}
function svUnfog(s){if(!s)return;for(let i=0;i<s.length;i++){const n=parseInt(s[i],16);for(let b=0;b<4;b++)if(i*4+b<FOG.length&&(n>>b)&1)FOG[i*4+b]=1;}fogDirty=true;}
function svSnapshot(){
  return{v:SAVE_V,game:"Dragon's Rampage",when:Date.now(),lvl:G.lvl,easy:!!EASY,gfx:!!GFX_HI,playT:Math.round(GAME_PLAYT),
    G:svFlat(G,['spawnQ','banner','msg','regBanner','over','overT','won','wonT','bigMap']),
    D:svPrim(D,['vx','vy','quip','quipT']),PR:svPrim(PR),
    S:structures.map(s=>Object.assign(svPrim(s,['id']),{kind:s.kind,x:Math.round(s.x),y:Math.round(s.y)})),
    T:trees.map(t=>TREE_C[t.state]||'o').join(''),nT:trees.length,
    C:cells.map(c=>c.burnt?-1:Math.round((c.growth||0)*100)),
    GP:goldPiles.map(p=>svPrim(p)),FOG:svFog(),
    RAID:{n:RAID.n,thr:RAID.thr,cd:RAID.cd},TROPH:TROPHIES.map(t=>({name:t.name,short:t.short,col:t.col,trim:t.trim,crest:t.crest,big:!!t.big})),
    WK:wkSave(),tally:{g:TALLY.game,pr:TALLY.prGame}};}
function svMeta(d){return{v:d.v,when:d.when,gold:Math.round((d.G.stash||0)+(d.D.gold||0)),stash:d.G.stash||0,carry:d.D.gold||0,wanted:d.G.level||0,lvl:d.lvl||1,playT:d.playT||0,easy:d.easy,pr:d.PR&&d.PR.state};}
function svWrite(key){if(scene!=='play'||G.over||G.won)return false;try{const d=svSnapshot();localStorage.setItem(key,JSON.stringify(d));localStorage.setItem(key+'_meta',JSON.stringify(svMeta(d)));svCache=null;return true;}catch(e){console.warn('save failed',e);return false;}}
function svList(){if(svCache&&performance.now()-svCacheT<800)return svCache;
  svCache=SAVE_KEYS.map(([key,name,auto])=>{let raw=null,info=null;try{raw=localStorage.getItem(key);const m=localStorage.getItem(key+'_meta');if(raw){info=m?JSON.parse(m):null;if(!info){const d=JSON.parse(raw);if(d&&d.G&&d.D)info=svMeta(d);}if(info&&!(info.v>=SAVE_MIN&&info.v<=SAVE_V))info.old=1;}}catch(e){info=null;}
    return{key,name,auto:!!auto,raw:!!raw,info};});svCacheT=performance.now();return svCache;}
function svHasAny(){return svList().some(s=>s.info&&!s.info.old);}
function svWhen(ts){try{return new Date(ts).toLocaleString([], {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return String(new Date(ts));}}
function svDur(s){s=Math.max(0,Math.round(s||0));const h=Math.floor(s/3600),m=Math.floor(s/60)%60,x=s%60;return h?`${h}h ${m}m`:`${m}m ${String(x).padStart(2,'0')}s`;}
function svDesc(i){if(!i)return'';if(i.old)return'Saved by an older version of the game: it cannot be loaded, sorry!';
  return`Gold ${i.gold}  ·  Wanted ${i.wanted}: ${LEVEL_NAMES[i.wanted]||''}  ·  Castle lvl ${i.lvl}  ·  Played ${svDur(i.playT)}${i.easy?'  ·  Easy':''}${i.pr==='carried'?'  ·  ♛ carrying the Princess':''}`;}
function svLoad(key){let d;try{d=JSON.parse(localStorage.getItem(key)||'null');}catch(e){return'That save looks damaged and could not be read, sorry!';}
  if(!d)return'That slot is empty.';
  if(!d.v||d.v<SAVE_MIN)return'That save is from an older version of the game and can\'t be loaded, sorry! Start a fresh rampage instead.';
  if(d.v>SAVE_V)return'That save is from a newer version of the game. Reload the page to update, then try again.';
  if(!d.G||!d.D||!Array.isArray(d.S))return'That save is missing data and could not be loaded, sorry!';
  try{svApply(d);return true;}catch(e){console.warn('load failed',e);newGame();return'Something went wrong loading that save, so a new game was started instead.';}}
function svApply(d){
  setEasy(!!d.easy);if(typeof setGfx==='function'&&typeof d.gfx==='boolean'&&d.gfx!==GFX_HI)setGfx(d.gfx);
  TALLY_KEEP=true;newGame({lvl:d.lvl||1,bank:d.G.bank||0});scene='play';
  for(const k in d.G)G[k]=d.G[k];G.over=false;G.won=false;G.banner=null;G.msg=null;G.spawnQ=[];G.regBanner=null;
  Object.assign(D,d.D);D.vx=0;D.vy=0;
  Object.assign(PR,d.PR||{});if(PR.state!=='carried')D.princess=false;
  // buildings, bridges, wells, the gate, the castle and the keep roof
  const used=new Set();
  d.S.forEach((r,i)=>{let s=structures[i];if(!s||used.has(s)||s.kind!==r.kind||Math.abs(s.x-r.x)>3||Math.abs(s.y-r.y)>3){s=null;let bd=300*300;for(const t of structures){if(used.has(t)||t.kind!==r.kind)continue;const q=d2(t.x,t.y,r.x,r.y);if(q<bd){bd=q;s=t;}}}
    if(!s)return;used.add(s);for(const k in r)if(k!=='x'&&k!=='y'&&k!=='kind')s[k]=r[k];s.builder=null;});
  if(typeof d.T==='string'&&d.nT===trees.length)for(let i=0;i<trees.length;i++){const st=TREE_S[d.T[i]]||'ok';if(st!=='ok'){const t=trees[i];t.state=st;t.hp=0;t.fire=0;t.claimed=null;t.regrow=60;}}
  if(Array.isArray(d.C)&&d.C.length===cells.length)cells.forEach((c,i)=>{const v=d.C[i];if(v<0){c.burnt=true;c.growth=0;}else{c.burnt=false;c.growth=v/100;}c.fire=0;c.claimed=null;});
  if(Array.isArray(d.GP))d.GP.forEach((p,i)=>{if(goldPiles[i])Object.assign(goldPiles[i],p);});
  svUnfog(d.FOG);
  if(d.RAID){RAID.n=d.RAID.n||0;RAID.thr=d.RAID.thr||0;RAID.cd=Math.max(30,d.RAID.cd||0);RAID.cur=null;}
  TROPHIES.length=0;(d.TROPH||[]).forEach((t,i)=>{const s=trophySlot(i);TROPHIES.push(Object.assign({},t,{x:s.x,y:s.y,a:s.a,t0:G.t-5,raidRef:null,ph:Math.random()*6}));});
  if(typeof HOARD!=='undefined')HOARD.shown=G.stash||0;
  wkLoad(d.WK);
  // live enemies are not saved: guards and waves re-muster from the wanted level and wave timers
  G.waveCD=Math.max(G.waveCD||0,8);G.spawnQT=0;
  if(d.tally){TALLY.game=d.tally.g||{};TALLY.prGame=d.tally.pr||0;}if(PR.state==='carried'||PR.state==='lair')G._prCap=1;
  GAME_PLAYT=d.playT||0;svAutoT=0;
  cam.x=D.x;cam.y=D.y;G.banner={text:'Game loaded',sub:`${svWhen(d.when)}  ·  Castle level ${G.lvl}`,t:2.5};}
function svAuto(){if(scene==='play'&&!G.over&&!G.won&&G.t>3){svWrite('dr_save_auto');svAutoT=0;}}
const _updateSV=update;update=function(dt){const r=_updateSV.apply(this,arguments);if(scene==='play'&&!G.over&&!G.won){svAutoT+=dt;if(svAutoT>=AUTOSAVE_EVERY)svAuto();}return r;};
const _newGameSV=newGame;newGame=function(){const r=_newGameSV.apply(this,arguments);svAutoT=0;return r;};
// ================= partSC: SUPPLY CARTS + the CASTLE STOREHOUSE =================
// Loggers and miners pile their work in the camp/mine yards (G.yardWood / G.yardStone). Horse carts, each LED by a
// villager driver walking at the horse's head, haul it along the roads to the Castle Storehouse beside the castle.
// Only cargo that is DELIVERED joins the kingdom stockpile (G.wood / G.stone) that pays for rebuilding.
const STORE_POS={x:1730,y:4075},STORE_DOOR={x:1815,y:4068};
const SC={cap:5,perSrc:2,respawn:35,speed:46,loadEvery:1.1,lazyGo:22,strandT:40,lossFrac:.4,horseGap:22,cartGap:48};
const SC_SRC={
  camp:{kind:'wood',yard:'logpile',park:()=>({x:LOGPILE_POS.x+64,y:LOGPILE_POS.y+26}),job:'woodcutter',name:'logging camp'},
  mine:{kind:'stone',yard:'stonepile',park:()=>({x:STONEPILE_POS.x-60,y:STONEPILE_POS.y+30}),job:'miner',name:'mine'}};
function storeS(){return structures.find(s=>s.kind==='storehouse');}
function storeUp(){const s=storeS();return !!s&&s.state==='ok';}
function scList(){return carts.filter(c=>c.supply);}
function scLive(){return carts.filter(c=>c.supply&&!c.wrecked);}
function scWorkers(src){const j=SC_SRC[src].job;return units.filter(u=>u.type==='villager'&&!u.dead&&u.job===j&&!(u.wk&&!u.wk.done)).length;}
function yardGet(kind){return kind==='wood'?(G.yardWood||0):(G.yardStone||0);}
function yardTake(kind,n){if(kind==='wood')G.yardWood=(G.yardWood||0)-n;else G.yardStone=(G.yardStone||0)-n;}
// a route = polyline with cumulative lengths; position by arc length (negative = behind the start along the first leg)
function scRoute(a,b){const r=typeof roadPath==='function'?roadPath(a.x,a.y,b.x,b.y):null;const P=[{x:a.x,y:a.y}];
  if(r&&r.P)for(const v of r.P)P.push({x:v.x,y:v.y});if(b===STORE_DOOR||(Math.abs(b.x-STORE_DOOR.x)<2&&Math.abs(b.y-STORE_DOOR.y)<2))P.push({x:STORE_DOOR.x,y:STORE_DOOR.y-60});
  P.push({x:b.x,y:b.y});const Q=[P[0]];for(const p of P)if(Math.hypot(p.x-Q[Q.length-1].x,p.y-Q[Q.length-1].y)>4)Q.push(p);
  const L=[0];for(let i=1;i<Q.length;i++)L.push(L[i-1]+Math.hypot(Q[i].x-Q[i-1].x,Q[i].y-Q[i-1].y));return{P:Q,L,len:L[L.length-1]};}
function scAt(R,s){const P=R.P,L=R.L;if(P.length<2)return{x:P[0].x,y:P[0].y,a:0};
  if(s<=0){const a=Math.atan2(P[1].y-P[0].y,P[1].x-P[0].x);return{x:P[0].x+Math.cos(a)*s,y:P[0].y+Math.sin(a)*s,a};}
  let i=1;while(i<P.length-1&&L[i]<s)i++;const a=Math.atan2(P[i].y-P[i-1].y,P[i].x-P[i-1].x),seg=(L[i]-L[i-1])||1,k=Math.min(1,(s-L[i-1])/seg);
  return{x:P[i-1].x+(P[i].x-P[i-1].x)*k,y:P[i-1].y+(P[i].y-P[i-1].y)*k,a};}
function scMkDriver(x,y){const u=spawnVillager(x,y,'carter',8);u.shirt='#6a4a8a';return u;}
function scMkHorse(x,y){const h=mkUnit('animal',x,y,{species:'horse',hp:16,maxHp:16,cartHorse:true,pen:{x:x-40,y:y-30,w:80,h:60}});units.push(h);return h;}
function scSpawn(src,o){o=o||{};const S=SC_SRC[src],pk=S.park();
  const c={supply:true,src,kind:S.kind,load:o.load||0,st:o.st||'load',x:pk.x,y:pk.y,fire:0,wrecked:false,t:0,ang:0,waitT:0,loadT:0,strandT:0,id:Math.random()};
  c.R=c.st==='go'?scRoute(pk,STORE_DOOR):scRoute(STORE_DOOR,pk);c.s=c.st==='load'?c.R.len:0;if(o.s!=null)c.s=o.s;
  if(o.st==='back')c.s=o.s||0;
  const p=scAt(c.R,c.s);c.drv=o.noDrv?null:scMkDriver(p.x,p.y);if(c.drv)c.drv.scart=c;const hp=scAt(c.R,c.s-SC.horseGap);c.horse=o.noHorse?null:scMkHorse(hp.x,hp.y);if(c.horse)c.horse.scart=c;
  carts.push(c);scPlace(c,0,true);return c;}
function scAlive(u){return !!u&&!u.dead;}
// put horse + cart on the route behind the driver's lead point
function scPlace(c,dt,snap){const lead=scAt(c.R,c.s),hp=scAt(c.R,c.s-SC.horseGap),cp=scAt(c.R,c.s-SC.cartGap);
  c.lead=lead;c.x=cp.x;c.y=cp.y;c.ang=Math.atan2(hp.y-cp.y,hp.x-cp.x);
  const H=c.horse;if(scAlive(H)&&!H.loose){H.x=hp.x;H.y=hp.y;H.face=Math.cos(hp.a)>=0?1:-1;if(dt&&!c.halt)H.anim+=dt*6;H.state='idle';}
  const u=c.drv;if(snap&&scAlive(u)){const px=-Math.sin(lead.a)*9,py=Math.cos(lead.a)*9;u.x=lead.x+px;u.y=lead.y+py;}}
function scDeliver(c){const n=c.load|0;if(n<=0)return;if(c.kind==='wood')G.wood+=n;else G.stone+=n;c.load=0;
  G.stats.delivered=(G.stats.delivered||0)+n;float(STORE_DOOR.x,STORE_DOOR.y-46,`+${n} ${c.kind} delivered to the storehouse`,c.kind==='wood'?'#e8c090':'#e0e0e0');}
function scStep(c,dt){if(c.wrecked)return;
  const u=c.drv,H=c.horse,dOK=scAlive(u),hOK=scAlive(H)&&!H.loose;
  if(c.fire){c.halt=true;return;}
  // stranded: lost its driver or horse; a new one comes out once the dragon has gone
  if(!dOK||!hOK){c.halt=true;c.strandT+=dt;if(c.strandT>SC.strandT&&dist(c,D)>650){const p=scAt(c.R,c.s);
      if(!dOK){c.drv=scMkDriver(p.x,p.y);c.drv.scart=c;}if(!hOK){if(H&&H.loose){H.dead=true;H.gone=true;}c.horse=scMkHorse(c.x,c.y);c.horse.scart=c;}
      c.strandT=0;float(c.x,c.y-30,!dOK?'A new carter takes the reins':'A fresh horse is hitched up','#b8e0ff');}
    return;}
  if(u.state==='flee'||u.inside){c.halt=true;return;}
  // walk back to the horse's head before setting off again
  const L=c.lead||scAt(c.R,c.s),px=-Math.sin(L.a)*9,py=Math.cos(L.a)*9;
  if(Math.hypot(u.x-L.x-px,u.y-L.y-py)>6){c.halt=true;moveTo(u,L.x+px,L.y+py,52,dt);return;}
  c.halt=false;
  if(c.st==='load'){c.halt=true;u.face=1;c.waitT+=dt;c.loadT+=dt;
    if(c.loadT>=SC.loadEvery){c.loadT=0;if(c.load<SC.cap&&yardGet(c.kind)>0){yardTake(c.kind,1);c.load++;}}
    if(c.load>=SC.cap||(c.load>=2&&c.waitT>SC.lazyGo)){c.st='go';c.R=scRoute(SC_SRC[c.src].park(),STORE_DOOR);c.s=0;c.waitT=0;scPlace(c,0,true);
      float(c.x,c.y-30,`Cart of ${c.kind==='wood'?'logs':'stone'} heads for the castle`,'#e8d8b0');}
    return;}
  if(c.st==='wait'){c.halt=true;const s=storeS();
    if(s&&s.state==='ok'){scDeliver(c);c.st='back';c.R=scRoute(STORE_DOOR,SC_SRC[c.src].park());c.s=0;scPlace(c,0,true);return;}
    // the kingdom cannot afford the rebuild: tip the cargo onto the rubble so masons can pay for it
    const [w,st]=COST.storehouse;if(s&&!s.paid&&(G.wood<w||G.stone<st)&&c.load>0){c.waitT+=dt;if(c.waitT>4){scDeliver(c);float(STORE_DOOR.x,STORE_DOOR.y-64,'Cargo tipped out to rebuild the storehouse','#b8e0ff');c.st='back';c.R=scRoute(STORE_DOOR,SC_SRC[c.src].park());c.s=0;scPlace(c,0,true);}}
    return;}
  // on the road
  c.s+=SC.speed*dt;u.anim+=dt*8;
  if(c.s>=c.R.len){c.s=c.R.len;
    if(c.st==='go'){if(storeUp()){scDeliver(c);c.st='back';c.R=scRoute(STORE_DOOR,SC_SRC[c.src].park());c.s=0;}
      else{c.st='wait';c.waitT=0;float(STORE_DOOR.x,STORE_DOOR.y-50,'The storehouse is wrecked! The cart waits for the masons','#ffcf80');}}
    else if(c.st==='back'){c.st='load';c.waitT=0;c.loadT=0;}}
  scPlace(c,dt);const L2=c.lead,qx=-Math.sin(L2.a)*9,qy=Math.cos(L2.a)*9;u.x=L2.x+qx;u.y=L2.y+qy;u.face=Math.cos(L2.a)>=0?1:-1;}
function updSupply(dt){if(scene!=='play'&&scene!=='title')return;
  for(const c of carts)if(c.supply)scStep(c,dt);
  // runaway horses from smashed carts trot off and leave the map
  for(const H of units)if(H.cartHorse&&H.loose&&!H.dead){H.loose-=dt;const a=Math.atan2(H.y-D.y,H.x-D.x);H.x+=Math.cos(a)*70*dt;H.y+=Math.sin(a)*70*dt;H.face=Math.cos(a)>0?1:-1;H.anim+=dt*10;if(H.loose<=0){H.dead=true;H.gone=true;}}
  // respawn: a new cart comes out of each yard every so often while its camp has workers
  if(!G.scT)G.scT={};
  for(const src in SC_SRC){const S=SC_SRC[src],n=carts.filter(c=>c.supply&&!c.wrecked&&c.src===src).length,yard=pile(S.yard);
    if(n>=SC.perSrc||!yard||yard.state!=='ok'||!scWorkers(src)){G.scT[src]=Math.min(G.scT[src]||SC.respawn,SC.respawn);continue;}
    G.scT[src]=(G.scT[src]==null?SC.respawn:G.scT[src])-dt;
    if(G.scT[src]<=0&&dist(S.park(),D)>360){G.scT[src]=SC.respawn;scSpawn(src);float(S.park().x,S.park().y-40,`A new supply cart sets out from the ${S.name}`,'#b8e0ff');}}}
// wreck a supply cart: cargo is lost, the horse bolts, the driver runs
const _wreckCartSC=wreckCart;wreckCart=function(c){if(!c||!c.supply)return _wreckCartSC.apply(this,arguments);if(c.wrecked)return;
  c.wrecked=true;c.fire=0;c.t=12;const lost=c.load|0;c.load=0;G.stats.scarts=(G.stats.scarts||0)+1;addAlarm(4,c.x,c.y);
  if(typeof tallyAdd==='function')tallyAdd('supplycart');
  splinters&&splinters(c.x,c.y,6);puff(c.x,c.y-6,12,'rgba(150,130,110,',120,8);
  float(c.x,c.y-36,lost?`Supply cart smashed! ${lost} ${c.kind} lost`:'Supply cart smashed!','#ffb050');
  const H=c.horse;if(scAlive(H)){H.loose=8;}const u=c.drv;if(scAlive(u)){u.scart=null;u.job='peasant';u.state='flee';u.t=2;}};
const _calcScoreSC=calcScore;calcScore=function(){return _calcScoreSC.apply(this,arguments)+(G.stats.scarts||0)*40;};
// bites and dive slams smash carts too (stomps and fire already do)
const _tryEatSC=tryEat;tryEat=function(){const r=_tryEatSC.apply(this,arguments);if(D.alt<.5){const mx=D.x+Math.cos(D.ang)*40,my=D.y+Math.sin(D.ang)*40;
